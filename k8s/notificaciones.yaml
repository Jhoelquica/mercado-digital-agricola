apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificaciones
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notificaciones
  template:
    metadata:
      labels:
        app: notificaciones
    spec:
      containers:
        - name: notificaciones
          image: mercado_agricola-notificaciones:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          env:
            - name: DB_HOST
              value: db-notificaciones
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              value: admin
            - name: RABBITMQ_PASSWORD
              value: admin123
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # Antes dependía del fallback hardcodeado "clave-interna-servicios" en el código
            # (nunca estuvo wireada acá) — ahora requerida explícitamente, sin fallback.
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
---
apiVersion: v1
kind: Service
metadata:
  name: notificaciones
spec:
  type: LoadBalancer
  selector:
    app: notificaciones
  ports:
    - port: 8005
      targetPort: 8005