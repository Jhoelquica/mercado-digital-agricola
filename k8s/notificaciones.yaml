# Cómo llega Notificaciones a su base: host, puerto y nombre, escritos solo aquí. Los leen el initContainer y el
# contenedor del servicio (envFrom, más abajo) y la propia base (POSTGRES_DB en db-notificaciones.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: base-notificaciones
data:
  DB_HOST: db-notificaciones
  DB_PORT: "5432"
  DB_NAME: notificaciones
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificaciones
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notificaciones
  template:
    metadata:
      labels:
        app: notificaciones
    spec:
      # Antes de arrancar, espera a que SU base responda. Sin esto, al encender Docker Desktop (o al reiniciar la base) el
      # servicio arrancaba antes de que el DNS resolviera db-notificaciones, se caía 2 o 3 veces y Kubernetes lo reiniciaba.
      # Se comprueba con psql contra SU base de datos y no con pg_isready: tras un reinicio de Docker Desktop el Service sigue
      # unos segundos con la IP vieja de la base, que el nodo puede haber dado a OTRO Postgres, y pg_isready da por buena
      # cualquier respuesta (visto el 2026-11-16: db-transporte llevaba al Postgres de db-certificacion).
      # El host, el puerto y el nombre de la base salen de la ConfigMap base-notificaciones (arriba), la misma que usan el servicio
      # y la propia base. La contraseña va en PGPASSWORD desde el Secret, nunca en el comando. Misma imagen que las bases
      # (postgres:16, ya está en el nodo).
      initContainers:
        - name: esperar-base
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              intento=1
              until error=$(psql -w -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "select 1" 2>&1 >/dev/null); do
                echo "Esperando a la base $DB_NAME en $DB_HOST:$DB_PORT (intento $intento; otro en 2 s): $(echo "$error" | head -n 1)"
                intento=$((intento + 1))
                sleep 2
              done
              echo "La base $DB_NAME en $DB_HOST:$DB_PORT responde (intento $intento)"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999  # el usuario postgres de la imagen
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: base-notificaciones
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_NOTIFICACIONES
            - name: PGCONNECT_TIMEOUT
              value: "3"
      containers:
        - name: notificaciones
          image: localhost:5000/notificaciones:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (a su base ya la esperó el initContainer); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8005
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8005
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8005
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          envFrom:
            - configMapRef:
                name: base-notificaciones  # DB_HOST, DB_PORT y DB_NAME
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_PASSWORD
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_NOTIFICACIONES
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # Requerida explícitamente: el código no tiene valor por defecto.
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # H6: avisos al celular (Web Push) y, de respaldo, por correo (ver notificaciones/avisos_externos.py). Todas
            # opcionales: sin ellas en el Secret ese canal queda apagado y la aplicación funciona como antes. Las claves
            # VAPID se crean con scripts/generar_claves_avisos.py; las SMTP son las del proveedor de correo que elijas.
            - name: USUARIOS_URL
              value: http://usuarios:8006
            - name: VAPID_CLAVE_PUBLICA
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: VAPID_CLAVE_PUBLICA
                  optional: true
            - name: VAPID_CLAVE_PRIVADA
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: VAPID_CLAVE_PRIVADA
                  optional: true
            - name: VAPID_CONTACTO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: VAPID_CONTACTO
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PUERTO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: SMTP_PUERTO
                  optional: true
            - name: SMTP_USUARIO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: SMTP_USUARIO
                  optional: true
            - name: SMTP_CLAVE
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: SMTP_CLAVE
                  optional: true
            - name: SMTP_REMITENTE
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: SMTP_REMITENTE
                  optional: true
            - name: URL_APP
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: URL_APP
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: notificaciones
spec:
  # ClusterIP: no se publica en el host. La única entrada es el gateway (Traefik: valida el JWT y limita las
  # peticiones); para desarrollo, scripts/abrir-puertos.ps1 lo abre en 127.0.0.1 con kubectl port-forward.
  type: ClusterIP
  selector:
    app: notificaciones
  ports:
    - port: 8005
      targetPort: 8005