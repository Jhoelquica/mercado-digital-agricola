apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificaciones
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notificaciones
  template:
    metadata:
      labels:
        app: notificaciones
    spec:
      containers:
        - name: notificaciones
          image: localhost:5000/notificaciones:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (esperando a su base); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8005
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8005
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8005
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          env:
            - name: DB_HOST
              value: db-notificaciones
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              value: admin
            - name: RABBITMQ_PASSWORD
              value: admin123
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # Antes dependía del fallback hardcodeado "clave-interna-servicios" en el código
            # (nunca estuvo wireada acá) — ahora requerida explícitamente, sin fallback.
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
---
apiVersion: v1
kind: Service
metadata:
  name: notificaciones
spec:
  type: LoadBalancer
  selector:
    app: notificaciones
  ports:
    - port: 8005
      targetPort: 8005