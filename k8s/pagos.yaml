apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pagos
  template:
    metadata:
      labels:
        app: pagos
    spec:
      # Antes de arrancar, espera a que SU base responda. Sin esto, al encender Docker Desktop (o al reiniciar la base) el
      # servicio arrancaba antes de que el DNS resolviera db-pagos, se caía 2 o 3 veces y Kubernetes lo reiniciaba.
      # Se comprueba con psql contra SU base de datos y no con pg_isready: tras un reinicio de Docker Desktop el Service sigue
      # unos segundos con la IP vieja de la base, que el nodo puede haber dado a OTRO Postgres, y pg_isready da por buena
      # cualquier respuesta (visto el 2026-11-16: db-transporte llevaba al Postgres de db-certificacion).
      # El nombre de la base y el puerto son los fijos de database.py (no hay variable para ellos). La contraseña va en
      # PGPASSWORD desde el Secret, nunca en el comando. Misma imagen que las bases (postgres:16, ya está en el nodo).
      initContainers:
        - name: esperar-base
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              intento=1
              until error=$(psql -w -h "$DB_HOST" -p 5432 -U "$DB_USER" -d pagos -c "select 1" 2>&1 >/dev/null); do
                echo "Esperando a la base pagos en $DB_HOST:5432 (intento $intento; otro en 2 s): $(echo "$error" | head -n 1)"
                intento=$((intento + 1))
                sleep 2
              done
              echo "La base pagos en $DB_HOST:5432 responde (intento $intento)"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999  # el usuario postgres de la imagen
            allowPrivilegeEscalation: false
          env:
            - name: DB_HOST
              value: db-pagos
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_PAGOS
            - name: PGCONNECT_TIMEOUT
              value: "3"
      containers:
        - name: pagos
          image: localhost:5000/pagos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8007
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (a su base ya la esperó el initContainer); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8007
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8007
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8007
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          env:
            - name: DB_HOST
              value: db-pagos
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_PASSWORD
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_PAGOS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            - name: CULQI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: CULQI_SECRET_KEY
            # Pagos necesita la clave del par donde ES quien llama
            # (Pagos→Productos, para reponer_stock) y la del par donde es quien RECIBE la llamada
            # (Transporte→Pagos, para /pagos/interno/liquidar-repartidor), más la de limpieza QA.
            - name: PAGOS_A_PRODUCTOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PAGOS_A_PRODUCTOS_SECRETO
            - name: TRANSPORTE_A_PAGOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_PAGOS_SECRETO
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            - name: PRODUCTOS_URL
              value: http://productos:8002
            # GET /pagos/{pedido_id} pregunta a Pedidos de quién es el pedido antes de mostrar el pago.
            - name: PEDIDOS_URL
              value: http://pedidos:8003
            # "Mis ganancias": quién es el agricultor o el repartidor con sesión.
            - name: PRODUCTORES_URL
              value: http://productores:8001
            - name: TRANSPORTE_URL
              value: http://transporte:8004
            # Constancias de las transferencias bancarias (bucket PRIVADO pagos-constancias): mismas credenciales de
            # MinIO que Productos, Productores y Transporte.
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: MINIO_ROOT_PASSWORD
            # Cuenta a la que transfiere el comprador. DE EJEMPLO (lo dice el nombre del banco): en un despliegue real
            # van los datos de la cuenta del negocio. Si falta alguno, el checkout no ofrece la transferencia.
            - name: TRANSFERENCIA_BANCO
              value: "BCP (cuenta de ejemplo)"
            - name: TRANSFERENCIA_TITULAR
              value: "Chakra Shop S.A.C."
            - name: TRANSFERENCIA_CUENTA
              value: "191-00000000-0-00"
            - name: TRANSFERENCIA_CCI
              value: "002-191-000000000000-00"
---
apiVersion: v1
kind: Service
metadata:
  name: pagos
  labels:
    app: pagos
spec:
  type: LoadBalancer
  selector:
    app: pagos
  ports:
    - port: 8007
      targetPort: 8007