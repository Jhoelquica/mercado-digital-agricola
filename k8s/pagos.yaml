apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pagos
  template:
    metadata:
      labels:
        app: pagos
    spec:
      containers:
        - name: pagos
          image: localhost:5000/pagos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8007
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (esperando a su base); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8007
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8007
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8007
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          env:
            - name: DB_HOST
              value: db-pagos
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              value: admin
            - name: RABBITMQ_PASSWORD
              value: admin123
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            - name: CULQI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: CULQI_SECRET_KEY
            # Reemplaza SERVICIO_SECRETO: Pagos necesita la clave del par donde ES quien llama
            # (Pagos→Productos, para reponer_stock) y la del par donde es quien RECIBE la llamada
            # (Transporte→Pagos, para /pagos/interno/liquidar-repartidor), más la de limpieza QA.
            - name: PAGOS_A_PRODUCTOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PAGOS_A_PRODUCTOS_SECRETO
            - name: TRANSPORTE_A_PAGOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_PAGOS_SECRETO
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            - name: PRODUCTOS_URL
              value: http://productos:8002
            # GET /pagos/{pedido_id} pregunta a Pedidos de quién es el pedido antes de mostrar el pago.
            - name: PEDIDOS_URL
              value: http://pedidos:8003
            # "Mis ganancias": quién es el agricultor o el repartidor con sesión.
            - name: PRODUCTORES_URL
              value: http://productores:8001
            - name: TRANSPORTE_URL
              value: http://transporte:8004
            # Constancias de las transferencias bancarias (bucket PRIVADO pagos-constancias): mismas credenciales de
            # MinIO que Productos, Productores y Transporte.
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            # Cuenta a la que transfiere el comprador. DE EJEMPLO (lo dice el nombre del banco): en un despliegue real
            # van los datos de la cuenta del negocio. Si falta alguno, el checkout no ofrece la transferencia.
            - name: TRANSFERENCIA_BANCO
              value: "BCP (cuenta de ejemplo)"
            - name: TRANSFERENCIA_TITULAR
              value: "Chakra Shop S.A.C."
            - name: TRANSFERENCIA_CUENTA
              value: "191-00000000-0-00"
            - name: TRANSFERENCIA_CCI
              value: "002-191-000000000000-00"
---
apiVersion: v1
kind: Service
metadata:
  name: pagos
  labels:
    app: pagos
spec:
  type: LoadBalancer
  selector:
    app: pagos
  ports:
    - port: 8007
      targetPort: 8007