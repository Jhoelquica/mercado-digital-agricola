# Cómo llega Transporte a su base: host, puerto y nombre, escritos solo aquí. Los leen el initContainer y el
# contenedor del servicio (envFrom, más abajo) y la propia base (POSTGRES_DB en db-transporte.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: base-transporte
data:
  DB_HOST: db-transporte
  DB_PORT: "5432"
  DB_NAME: transporte
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transporte
spec:
  replicas: 3
  selector:
    matchLabels:
      app: transporte
  template:
    metadata:
      labels:
        app: transporte
    spec:
      # Antes de arrancar, espera a que SU base responda. Sin esto, al encender Docker Desktop (o al reiniciar la base) el
      # servicio arrancaba antes de que el DNS resolviera db-transporte, se caía 2 o 3 veces y Kubernetes lo reiniciaba.
      # Se comprueba con psql contra SU base de datos y no con pg_isready: tras un reinicio de Docker Desktop el Service sigue
      # unos segundos con la IP vieja de la base, que el nodo puede haber dado a OTRO Postgres, y pg_isready da por buena
      # cualquier respuesta (visto el 2026-11-16: db-transporte llevaba al Postgres de db-certificacion).
      # El host, el puerto y el nombre de la base salen de la ConfigMap base-transporte (arriba), la misma que usan el servicio
      # y la propia base. La contraseña va en PGPASSWORD desde el Secret, nunca en el comando. Misma imagen que las bases
      # (postgres:16, ya está en el nodo).
      initContainers:
        - name: esperar-base
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              intento=1
              until error=$(psql -w -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "select 1" 2>&1 >/dev/null); do
                echo "Esperando a la base $DB_NAME en $DB_HOST:$DB_PORT (intento $intento; otro en 2 s): $(echo "$error" | head -n 1)"
                intento=$((intento + 1))
                sleep 2
              done
              echo "La base $DB_NAME en $DB_HOST:$DB_PORT responde (intento $intento)"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999  # el usuario postgres de la imagen
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: base-transporte
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_TRANSPORTE
            - name: PGCONNECT_TIMEOUT
              value: "3"
      containers:
        - name: transporte
          image: localhost:5000/transporte:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (a su base ya la esperó el initContainer); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8004
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8004
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8004
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          envFrom:
            - configMapRef:
                name: base-transporte  # DB_HOST, DB_PORT y DB_NAME
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_PASSWORD
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_TRANSPORTE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # MinIO (foto de entrega, bucket privado transporte-entregas): las mismas credenciales de raíz con las que
            # arranca MinIO (ver k8s/minio.yaml), con sus propias claves en el Secret. El código no tiene valores por
            # defecto: sin estas variables el servicio no arranca.
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: MINIO_ROOT_PASSWORD
            - name: PEDIDOS_URL
              value: http://pedidos:8003
            - name: CERTIFICACION_URL
              value: http://certificacion:8008
            - name: PAGOS_URL
              value: http://pagos:8007
            # Sin estas dos, Transporte cae en su default (localhost) y dentro del pod no llega a nadie:
            # PRODUCTOS_URL resuelve el productor de cada envío (entrega directa) y PRODUCTORES_URL
            # resuelve al productor autenticado en GET /envios/pendientes-entrega-directa.
            - name: PRODUCTOS_URL
              value: http://productos:8002
            - name: PRODUCTORES_URL
              value: http://productores:8001
            # Transporte necesita la clave de cada par donde ES quien
            # llama (Transporte→Certificación, Transporte→Pagos) más la de limpieza QA.
            - name: TRANSPORTE_A_CERTIFICACION_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_CERTIFICACION_SECRETO
            - name: TRANSPORTE_A_PAGOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_PAGOS_SECRETO
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # Transporte -> Pedidos: GET /pedidos/interno/{id} (Pedidos lo valida, Transporte lo envía).
            - name: TRANSPORTE_A_PEDIDOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_PEDIDOS_SECRETO
---
apiVersion: v1
kind: Service
metadata:
  name: transporte
spec:
  # ClusterIP: no se publica en el host. La única entrada es el gateway (Traefik: valida el JWT y limita las
  # peticiones); para desarrollo, scripts/abrir-puertos.ps1 lo abre en 127.0.0.1 con kubectl port-forward.
  type: ClusterIP
  selector:
    app: transporte
  ports:
    - port: 8004
      targetPort: 8004