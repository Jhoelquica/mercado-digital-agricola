apiVersion: apps/v1
kind: Deployment
metadata:
  name: transporte
spec:
  replicas: 3
  selector:
    matchLabels:
      app: transporte
  template:
    metadata:
      labels:
        app: transporte
    spec:
      containers:
        - name: transporte
          image: localhost:5000/transporte:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          env:
            - name: DB_HOST
              value: db-transporte
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              value: admin
            - name: RABBITMQ_PASSWORD
              value: admin123
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            - name: PEDIDOS_URL
              value: http://pedidos:8003
            - name: CERTIFICACION_URL
              value: http://certificacion:8008
            - name: PAGOS_URL
              value: http://pagos:8007
            # Reemplaza SERVICIO_SECRETO: Transporte necesita la clave de cada par donde ES quien
            # llama (Transporte→Certificación, Transporte→Pagos) más la de limpieza QA.
            - name: TRANSPORTE_A_CERTIFICACION_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_CERTIFICACION_SECRETO
            - name: TRANSPORTE_A_PAGOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_PAGOS_SECRETO
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
---
apiVersion: v1
kind: Service
metadata:
  name: transporte
spec:
  type: LoadBalancer
  selector:
    app: transporte
  ports:
    - port: 8004
      targetPort: 8004