apiVersion: apps/v1
kind: Deployment
metadata:
  name: transporte
spec:
  replicas: 3
  selector:
    matchLabels:
      app: transporte
  template:
    metadata:
      labels:
        app: transporte
    spec:
      containers:
        - name: transporte
          image: localhost:5000/transporte:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          env:
            - name: DB_HOST
              value: db-transporte
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              value: admin
            - name: RABBITMQ_PASSWORD
              value: admin123
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # MinIO (foto de entrega, bucket privado transporte-entregas): las mismas credenciales de raíz con las que
            # arranca MinIO (ver k8s/minio.yaml). Sin esto el servicio caía en sus valores por defecto (admin/admin123),
            # que solo coinciden por casualidad con el Secret de desarrollo: con una contraseña real la foto no se subiría.
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: PEDIDOS_URL
              value: http://pedidos:8003
            - name: CERTIFICACION_URL
              value: http://certificacion:8008
            - name: PAGOS_URL
              value: http://pagos:8007
            # Sin estas dos, Transporte cae en su default (localhost) y dentro del pod no llega a nadie:
            # PRODUCTOS_URL resuelve el productor de cada envío (entrega directa) y PRODUCTORES_URL
            # resuelve al productor autenticado en GET /envios/pendientes-entrega-directa.
            - name: PRODUCTOS_URL
              value: http://productos:8002
            - name: PRODUCTORES_URL
              value: http://productores:8001
            # Reemplaza SERVICIO_SECRETO: Transporte necesita la clave de cada par donde ES quien
            # llama (Transporte→Certificación, Transporte→Pagos) más la de limpieza QA.
            - name: TRANSPORTE_A_CERTIFICACION_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_CERTIFICACION_SECRETO
            - name: TRANSPORTE_A_PAGOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_PAGOS_SECRETO
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # Transporte -> Pedidos: GET /pedidos/interno/{id} (Pedidos lo valida, Transporte lo envía).
            - name: TRANSPORTE_A_PEDIDOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_PEDIDOS_SECRETO
---
apiVersion: v1
kind: Service
metadata:
  name: transporte
spec:
  type: LoadBalancer
  selector:
    app: transporte
  ports:
    - port: 8004
      targetPort: 8004