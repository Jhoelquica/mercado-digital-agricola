apiVersion: apps/v1
kind: Deployment
metadata:
  name: productores
spec:
  replicas: 3
  selector:
    matchLabels:
      app: productores
  template:
    metadata:
      labels:
        app: productores
    spec:
      containers:
        - name: productores
          image: localhost:5000/productores:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: DB_HOST
              value: db-productores
            - name: PRODUCTOS_URL
              value: http://productos:8002
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # Antes dependía del fallback hardcodeado "clave-interna-servicios" en el código
            # (nunca estuvo wireada acá) — ahora requerida explícitamente, sin fallback.
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # aprobar_cosecha llama a POST /productos/interno/crear-desde-cosecha con este
            # secreto — Productos valida el mismo valor del lado suyo (ver k8s/productos.yaml).
            - name: PRODUCTORES_A_PRODUCTOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PRODUCTORES_A_PRODUCTOS_SECRETO
---
apiVersion: v1
kind: Service
metadata:
  name: productores
spec:
  type: LoadBalancer
  selector:
    app: productores
  ports:
    - port: 8001
      targetPort: 8001