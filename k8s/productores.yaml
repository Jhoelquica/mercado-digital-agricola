apiVersion: apps/v1
kind: Deployment
metadata:
  name: productores
spec:
  replicas: 3
  selector:
    matchLabels:
      app: productores
  template:
    metadata:
      labels:
        app: productores
    spec:
      containers:
        - name: productores
          image: localhost:5000/productores:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (esperando a su base); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8001
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8001
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          env:
            - name: DB_HOST
              value: db-productores
            - name: PRODUCTOS_URL
              value: http://productos:8002
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # Antes dependía del fallback hardcodeado "clave-interna-servicios" en el código
            # (nunca estuvo wireada acá) — ahora requerida explícitamente, sin fallback.
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # completar_cosecha llama a POST /productos/interno/crear-desde-cosecha con este
            # secreto — Productos valida el mismo valor del lado suyo (ver k8s/productos.yaml).
            - name: PRODUCTORES_A_PRODUCTOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PRODUCTORES_A_PRODUCTOS_SECRETO
            # completar_cosecha registra el primer evento de la cadena en Certificación con este
            # secreto (ver k8s/certificacion.yaml, que valida el mismo valor).
            - name: CERTIFICACION_URL
              value: http://certificacion:8008
            - name: PRODUCTORES_A_CERTIFICACION_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PRODUCTORES_A_CERTIFICACION_SECRETO
            # Fotos de las cosechas (bucket cosechas-evidencias, lectura pública: se muestran en la página del QR). Mismas
            # credenciales de MinIO que Productos y Transporte.
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_PUBLIC_URL
              value: http://localhost:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            # Sugerencia de la fecha de cosecha con IA (sugerencia_cosecha.py). OPCIONAL: si el Secret no tiene esta
            # clave, el pod arranca igual y la sugerencia sale de la tabla de ciclos típicos de los cultivos.
            # Plan GRATUITO de la API de Gemini (clave de aistudio.google.com).
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: GEMINI_API_KEY
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: productores
spec:
  type: LoadBalancer
  selector:
    app: productores
  ports:
    - port: 8001
      targetPort: 8001