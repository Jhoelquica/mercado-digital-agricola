# Cómo llega Pedidos a su base: host, puerto y nombre, escritos solo aquí. Los leen el initContainer y el
# contenedor del servicio (envFrom, más abajo) y la propia base (POSTGRES_DB en db-pedidos.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: base-pedidos
data:
  DB_HOST: db-pedidos
  DB_PORT: "5432"
  DB_NAME: pedidos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      # Antes de arrancar, espera a que SU base responda. Sin esto, al encender Docker Desktop (o al reiniciar la base) el
      # servicio arrancaba antes de que el DNS resolviera db-pedidos, se caía 2 o 3 veces y Kubernetes lo reiniciaba.
      # Se comprueba con psql contra SU base de datos y no con pg_isready: tras un reinicio de Docker Desktop el Service sigue
      # unos segundos con la IP vieja de la base, que el nodo puede haber dado a OTRO Postgres, y pg_isready da por buena
      # cualquier respuesta (visto el 2026-11-16: db-transporte llevaba al Postgres de db-certificacion).
      # El host, el puerto y el nombre de la base salen de la ConfigMap base-pedidos (arriba), la misma que usan el servicio
      # y la propia base. La contraseña va en PGPASSWORD desde el Secret, nunca en el comando. Misma imagen que las bases
      # (postgres:16, ya está en el nodo).
      initContainers:
        - name: esperar-base
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              intento=1
              until error=$(psql -w -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "select 1" 2>&1 >/dev/null); do
                echo "Esperando a la base $DB_NAME en $DB_HOST:$DB_PORT (intento $intento; otro en 2 s): $(echo "$error" | head -n 1)"
                intento=$((intento + 1))
                sleep 2
              done
              echo "La base $DB_NAME en $DB_HOST:$DB_PORT responde (intento $intento)"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999  # el usuario postgres de la imagen
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: base-pedidos
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_PEDIDOS
            - name: PGCONNECT_TIMEOUT
              value: "3"
      containers:
        - name: pedidos
          image: localhost:5000/pedidos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (a su base ya la esperó el initContainer); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8003
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8003
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8003
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          envFrom:
            - configMapRef:
                name: base-pedidos  # DB_HOST, DB_PORT y DB_NAME
          env:
            # GET /pedidos/{id} le pregunta a Transporte si el repartidor que lo pide tiene ese envío asignado.
            - name: TRANSPORTE_URL
              value: http://transporte:8004
            # Cancelar un pedido pagado le pide a Pagos que devuelva el dinero.
            - name: PAGOS_URL
              value: http://pagos:8007
            # "Mis ventas": quién es el agricultor con sesión.
            - name: PRODUCTORES_URL
              value: http://productores:8001
            - name: PRODUCTOS_URL
              value: http://productos:8002
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_PASSWORD
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_PEDIDOS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # Requeridas explícitamente: el código no tiene valor por defecto.
            - name: PEDIDOS_A_PRODUCTOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PEDIDOS_A_PRODUCTOS_SECRETO
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # Transporte -> Pedidos: GET /pedidos/interno/{id} (Pedidos lo valida, Transporte lo envía).
            - name: TRANSPORTE_A_PEDIDOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_PEDIDOS_SECRETO
            # DNI de quien recibe un pedido en otra ciudad, consultado en RENIEC (ver pedidos/reniec.py). apis.net.pe
            # respondía sin clave el 2026-10-03; desde el 2026-10-14 la exige (401 "Apikey Required"). La misma clave
            # sirve para SUNAT (usuarios.yaml): se guardan las dos con scripts/poner_clave_apis_net_pe.py.
            - name: RENIEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RENIEC_TOKEN
                  optional: true
            # Solo en local: RENIEC simulado con los DNIs de prueba de pedidos/reniec.py (DNIS_DE_PRUEBA). Para GKE,
            # deploy/gcp/generar_manifiestos.py lo pone en "real".
            - name: RENIEC_MODO
              value: simulado
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos
spec:
  # ClusterIP: no se publica en el host. La única entrada es el gateway (Traefik: valida el JWT y limita las
  # peticiones); para desarrollo, scripts/abrir-puertos.ps1 lo abre en 127.0.0.1 con kubectl port-forward.
  type: ClusterIP
  selector:
    app: pedidos
  ports:
    - port: 8003
      targetPort: 8003