apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
        - name: pedidos
          image: localhost:5000/pedidos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (esperando a su base); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8003
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8003
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8003
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          env:
            - name: DB_HOST
              value: db-pedidos
            # GET /pedidos/{id} le pregunta a Transporte si el repartidor que lo pide tiene ese envío asignado.
            - name: TRANSPORTE_URL
              value: http://transporte:8004
            # Cancelar un pedido pagado le pide a Pagos que devuelva el dinero.
            - name: PAGOS_URL
              value: http://pagos:8007
            # "Mis ventas": quién es el agricultor con sesión.
            - name: PRODUCTORES_URL
              value: http://productores:8001
            - name: PRODUCTOS_URL
              value: http://productos:8002
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              value: admin
            - name: RABBITMQ_PASSWORD
              value: admin123
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # Antes dependía del fallback hardcodeado "clave-interna-servicios" en el código
            # (nunca estuvo wireada acá) — ahora requeridas explícitamente, sin fallback.
            - name: PEDIDOS_A_PRODUCTOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PEDIDOS_A_PRODUCTOS_SECRETO
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # Transporte -> Pedidos: GET /pedidos/interno/{id} (Pedidos lo valida, Transporte lo envía).
            - name: TRANSPORTE_A_PEDIDOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_PEDIDOS_SECRETO
            # DNI de quien recibe un pedido en otra ciudad, consultado en RENIEC (ver pedidos/reniec.py). apis.net.pe
            # respondía sin clave el 2026-10-03; desde el 2026-10-14 la exige (401 "Apikey Required"). La misma clave
            # sirve para SUNAT (usuarios.yaml): se guardan las dos con scripts/poner_clave_apis_net_pe.py.
            - name: RENIEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RENIEC_TOKEN
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos
spec:
  type: LoadBalancer
  selector:
    app: pedidos
  ports:
    - port: 8003
      targetPort: 8003