# Middlewares reutilizables del API Gateway. Referenciados desde k8s/traefik-routes.yaml.
#
# Orden en el que se encadenan en cada ruta (importa, ver comentario en cada IngressRoute):
#   rate-limit-global -> cors-global -> auth-jwt (rutas que exigen sesión) o auth-sesion (las demás) -> strip-api-prefix
#
# cors-global va ANTES que auth-jwt a propósito: un preflight CORS (OPTIONS) del navegador nunca
# trae header Authorization, así que si auth-jwt corriera primero, todo preflight a una ruta
# protegida sería rechazado con 401 y el navegador nunca llegaría a hacer la petición real.
# El middleware de headers de Traefik responde el preflight directamente (sin llamar a auth-jwt).

# ============ CORS (centralizado; antes repetido con allow_origins=["*"] en los 8 servicios) ============
# Se deja el CORSMiddleware también en cada microservicio como respaldo (doble capa), tal como
# se pidió — no se ha tocado ese código. allow_origins=["*"] no combina con credenciales/cookies;
# esta app usa Bearer tokens en el header Authorization, no cookies, así que es seguro igual que
# la configuración original que reemplaza/complementa.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-global
spec:
  headers:
    accessControlAllowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    accessControlAllowHeaders: ["*"]
    accessControlAllowOriginList: ["*"]
    accessControlMaxAge: 86400
    addVaryHeader: true

---
# ============ RATE LIMITING (nativo de Traefik, sin código nuevo) ============
# 100 req/s sostenidas por IP de origen, con ráfaga permitida de 200 (para que cargar una vista
# que dispara varias llamadas a la vez, ej. el catálogo + reseñas + envío, no choque contra el
# límite en un instante puntual). Ajusta average/burst si el patrón de uso real lo pide.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-global
spec:
  rateLimit:
    average: 100
    period: 1s
    burst: 200
    sourceCriterion:
      ipStrategy:
        # depth:0 = usa la IP de origen de la conexión TCP tal cual la ve Traefik.
        # Si en el futuro el LoadBalancer real queda detrás de otro proxy/CDN (ej. Cloudflare,
        # un Ingress externo, otro balanceador L7), esa IP dejará de ser la del cliente final y
        # este límite se aplicará por IP del proxy anterior (efectivamente un límite global, no
        # por usuario) — en ese caso hay que cambiar a excludedIPs/depth según X-Forwarded-For.
        depth: 0

---
# ============ AUTENTICACIÓN CENTRALIZADA (ForwardAuth en TODAS las rutas de /api) ============
# Antes de que la petición llegue al microservicio destino, Traefik le pregunta a Usuarios con la cabecera
# Authorization de la petición original (authRequestHeaders: solo esa). Si Usuarios no responde 2xx, Traefik devuelve
# ese mismo status al cliente y la petición no sigue. Hay dos variantes, y cada ruta de /api lleva una de las dos
# (scripts/verificar_despliegue.py da FALLA si alguna no lleva ninguna):
#   - auth-jwt: las rutas que siempre exigen sesión (las específicas de traefik-routes.yaml). Sin token, 401.
#   - auth-sesion: la ruta general de cada servicio. Sin token deja pasar como visitante (el servicio decide si la ruta
#     pide sesión: el catálogo, el login y las llamadas con X-Servicio-Secreto siguen igual); con un token, tiene que
#     valer: uno inválido, vencido o revocado recibe 401 aquí mismo, en cualquier ruta.
# Así Usuarios queda en el camino de todas las peticiones de la API: va con 3 réplicas y un PodDisruptionBudget (ver
# k8s/usuarios.yaml).
#
# authResponseHeaders: Traefik copia X-Usuario-Id y X-Usuario-Rol de la respuesta de Usuarios a la petición, y antes
# BORRA las que haya mandado el cliente (también cuando Usuarios no las devuelve, como con un visitante): un cliente no
# puede hacerlas pasar falsificadas. Aun así son solo una conveniencia (logs): ningún microservicio las usa para
# autenticar, cada uno sigue validando el JWT del Authorization, que Traefik reenvía intacto (defensa en profundidad).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-jwt
spec:
  forwardAuth:
    address: http://usuarios:8006/usuarios/validar-token
    authRequestHeaders:
      - Authorization
    authResponseHeaders:
      - X-Usuario-Id
      - X-Usuario-Rol

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-sesion
spec:
  forwardAuth:
    address: http://usuarios:8006/usuarios/validar-sesion
    authRequestHeaders:
      - Authorization
    authResponseHeaders:
      - X-Usuario-Id
      - X-Usuario-Rol

---
# ============ ENRUTAMIENTO: un único StripPrefix compartido con los 8 prefijos ============
# /api/<servicio> es solo el namespace público del Gateway; lo que queda después de quitarlo es
# exactamente el path que cada microservicio ya expone hoy (ej. /api/pedidos/pedidos/abc ->
# /pedidos/abc), así que no hace falta un StripPrefix distinto por servicio.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
spec:
  stripPrefix:
    prefixes:
      - /api/usuarios
      - /api/productores
      - /api/productos
      - /api/pedidos
      - /api/transporte
      - /api/notificaciones
      - /api/pagos
      - /api/certificacion

---
# Quita /media antes de mandar la petición a MinIO: la URL pública de una foto es https://<dominio>/media/<bucket>/<archivo>
# y MinIO la espera como /<bucket>/<archivo>. (Ruta en k8s/traefik-routes.yaml.)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-media-prefix
spec:
  stripPrefix:
    prefixes:
      - /media

---
# Rechaza TODO con 403: solo deja pasar a una IP de documentación (192.0.2.1, reservada para ejemplos: nadie la tiene),
# es decir, a nadie. Se usa en la ruta `bloqueados` de traefik-routes.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: denegar-todo
spec:
  ipAllowList:
    sourceRange:
      - 192.0.2.1/32
