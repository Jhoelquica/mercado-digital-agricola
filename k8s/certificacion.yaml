apiVersion: apps/v1
kind: Deployment
metadata:
  name: certificacion
spec:
  replicas: 3
  selector:
    matchLabels:
      app: certificacion
  template:
    metadata:
      labels:
        app: certificacion
    spec:
      containers:
        - name: certificacion
          image: localhost:5000/certificacion:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8008
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (esperando a su base); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8008
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8008
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8008
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          env:
            - name: DB_HOST
              value: db-certificacion
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            - name: FRONTEND_URL
              value: http://localhost:63342/mercado_agricola/frontend
            - name: PRODUCTORES_URL
              value: http://productores:8001
            # Reemplaza SERVICIO_SECRETO: Certificación valida la clave del par
            # Transporte→Certificación (recibe, no envía) más la de limpieza QA.
            - name: TRANSPORTE_A_CERTIFICACION_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: TRANSPORTE_A_CERTIFICACION_SECRETO
            - name: PRODUCTORES_A_CERTIFICACION_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PRODUCTORES_A_CERTIFICACION_SECRETO
            # Productos -> Certificación: POST /certificacion/{id}/llegada-almacen (Certificación lo valida).
            - name: PRODUCTOS_A_CERTIFICACION_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PRODUCTOS_A_CERTIFICACION_SECRETO
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # Certificación -> Usuarios: GET /usuarios/interno/{id}/credencial (la credencial que el admin le asignó al
            # verificador al invitarlo; va en su perfil). Certificación envía, no recibe.
            - name: USUARIOS_URL
              value: http://usuarios:8006
            - name: CERTIFICACION_A_USUARIOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: CERTIFICACION_A_USUARIOS_SECRETO

---
apiVersion: v1
kind: Service
metadata:
  name: certificacion
  labels:
    app: certificacion
spec:
  type: LoadBalancer
  selector:
    app: certificacion
  ports:
    - port: 8008
      targetPort: 8008