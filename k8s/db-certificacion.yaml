apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-certificacion-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-certificacion
spec:
  replicas: 1
  # Recreate (no RollingUpdate): el volumen es de un solo nodo y con RollingUpdate Kubernetes levanta el pod NUEVO mientras el
  # viejo sigue vivo. Dos procesos sobre los mismos datos (en un solo nodo el volumen se monta en ambos) pueden corromperlos, y
  # en varios nodos la actualización se queda colgada esperando el volumen. Con Recreate se apaga primero el viejo (un corte de
  # unos segundos en cada actualización, aceptable). Igual que rabbitmq.yaml y redis.yaml.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db-certificacion
  template:
    metadata:
      labels:
        app: db-certificacion
    spec:
      containers:
        - name: db-certificacion
          image: postgres:16
          ports:
            - containerPort: 5432
          # La base "está lista" cuando acepta conexiones. Sin liveness a propósito: reiniciar una base por un mal rato es peor.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: certificacion
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: db-certificacion-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db-certificacion
spec:
  selector:
    app: db-certificacion
  ports:
    - port: 5432
      targetPort: 5432