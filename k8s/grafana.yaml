apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          # Versión fija (antes :latest): la misma que ya corría, 13.2.3.
          image: grafana/grafana:13.2.3
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123
            # El tablero se puede mirar sin iniciar sesión (solo lectura); editar sigue pidiendo la cuenta admin.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/chakrashop/servicios.json
          # Fuente de datos y tablero provisionados (ver k8s/grafana-provisioning.yaml).
          volumeMounts:
            - name: fuentes
              mountPath: /etc/grafana/provisioning/datasources
            - name: proveedor-tableros
              mountPath: /etc/grafana/provisioning/dashboards
            - name: tableros
              mountPath: /var/lib/grafana/dashboards/chakrashop
      volumes:
        - name: fuentes
          configMap:
            name: grafana-fuentes
        - name: proveedor-tableros
          configMap:
            name: grafana-proveedor-tableros
        - name: tableros
          configMap:
            name: grafana-tableros
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000