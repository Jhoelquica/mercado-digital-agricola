# Cómo llega Productos a su base: host, puerto y nombre, escritos solo aquí. Los leen el initContainer y el
# contenedor del servicio (envFrom, más abajo) y la propia base (POSTGRES_DB en db-productos.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: base-productos
data:
  DB_HOST: db-productos
  DB_PORT: "5432"
  DB_NAME: productos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: productos
  template:
    metadata:
      labels:
        app: productos
    spec:
      # Antes de arrancar, espera a que SU base responda. Sin esto, al encender Docker Desktop (o al reiniciar la base) el
      # servicio arrancaba antes de que el DNS resolviera db-productos, se caía 2 o 3 veces y Kubernetes lo reiniciaba.
      # Se comprueba con psql contra SU base de datos y no con pg_isready: tras un reinicio de Docker Desktop el Service sigue
      # unos segundos con la IP vieja de la base, que el nodo puede haber dado a OTRO Postgres, y pg_isready da por buena
      # cualquier respuesta (visto el 2026-11-16: db-transporte llevaba al Postgres de db-certificacion).
      # El host, el puerto y el nombre de la base salen de la ConfigMap base-productos (arriba), la misma que usan el servicio
      # y la propia base. La contraseña va en PGPASSWORD desde el Secret, nunca en el comando. Misma imagen que las bases
      # (postgres:16, ya está en el nodo).
      initContainers:
        - name: esperar-base
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              intento=1
              until error=$(psql -w -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "select 1" 2>&1 >/dev/null); do
                echo "Esperando a la base $DB_NAME en $DB_HOST:$DB_PORT (intento $intento; otro en 2 s): $(echo "$error" | head -n 1)"
                intento=$((intento + 1))
                sleep 2
              done
              echo "La base $DB_NAME en $DB_HOST:$DB_PORT responde (intento $intento)"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999  # el usuario postgres de la imagen
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: base-productos
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_PRODUCTOS
            - name: PGCONNECT_TIMEOUT
              value: "3"
      volumes:
        # Sin subPath: si la ConfigMap cambia (una rotación de claves), Kubernetes actualiza los archivos solo.
        - name: jwt-claves-publicas
          configMap:
            name: jwt-claves-publicas
      containers:
        - name: productos
          image: localhost:5000/productos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (a su base ya la esperó el initContainer); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8002
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8002
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8002
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: jwt-claves-publicas
              mountPath: /etc/chakrashop/jwt/publicas
              readOnly: true
          envFrom:
            - configMapRef:
                name: base-productos  # DB_HOST, DB_PORT y DB_NAME
          env:
            - name: PRODUCTORES_URL
              value: http://productores:8001
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_PRODUCTOS
            # Las claves PÚBLICAS que verifican los tokens (RS256, ver comun/auth.py): la ConfigMap jwt-claves-publicas,
            # montada aquí abajo. La genera scripts/claves_jwt.py (en Google Cloud, deploy/gcp/crear_secretos.py).
            - name: JWT_CLAVES_PUBLICAS
              value: /etc/chakrashop/jwt/publicas
            - name: USUARIOS_URL
              value: http://usuarios:8006
            - name: PEDIDOS_URL
              value: http://pedidos:8003
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_PASSWORD

            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_PUBLIC_URL
              value: http://localhost:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                   name: credenciales-app
                   key: MINIO_ROOT_PASSWORD
            # 3 claves dedicadas: una por cada servicio que llama a Productos.
            - name: PAGOS_A_PRODUCTOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PAGOS_A_PRODUCTOS_SECRETO
            - name: PEDIDOS_A_PRODUCTOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PEDIDOS_A_PRODUCTOS_SECRETO
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            - name: PRODUCTORES_A_PRODUCTOS_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PRODUCTORES_A_PRODUCTOS_SECRETO
            # Al confirmar la llegada de un producto al almacén, Productos deja el evento llegada_almacen
            # en su cadena de Certificación (con esta clave, que Certificación valida).
            - name: CERTIFICACION_URL
              value: http://certificacion:8008
            - name: PRODUCTOS_A_CERTIFICACION_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: PRODUCTOS_A_CERTIFICACION_SECRETO
            # Caché del catálogo (ver productos/cache.py). Valor fijo por ahora: Redis solo es
            # alcanzable dentro del clúster (Service ClusterIP en k8s/redis.yaml) y hoy no tiene
            # contraseña — cuando se le active requirepass, esto pasa a secretKeyRef igual que
            # DB_PASSWORD (ver el comentario de seguridad en k8s/redis.yaml).
            - name: REDIS_HOST
              value: redis
            # NO renombrar a REDIS_PORT: Kubernetes inyecta automáticamente esa variable
            # (formato tcp://<cluster-ip>:6379) para el Service "redis" de k8s/redis.yaml, y
            # pisa cualquier valor puesto acá — causó CrashLoopBackOff real en las 3 réplicas
            # (int("tcp://...") revienta). Ver el comentario largo en productos/cache.py.
            - name: REDIS_CACHE_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: productos
spec:
  # ClusterIP: no se publica en el host. La única entrada es el gateway (Traefik: valida el JWT y limita las
  # peticiones); para desarrollo, scripts/abrir-puertos.ps1 lo abre en 127.0.0.1 con kubectl port-forward.
  type: ClusterIP
  selector:
    app: productos
  ports:
    - port: 8002
      targetPort: 8002