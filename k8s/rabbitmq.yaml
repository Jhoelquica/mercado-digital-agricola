# Los mensajes persistentes (delivery_mode=2, ver los rabbitmq_publisher.py) solo sobreviven a un
# reinicio de RabbitMQ si este guarda sus datos en disco: sin este volumen, /var/lib/rabbitmq vive en
# el filesystem del contenedor y se pierde en cada reinicio (Docker Desktop, kubelet, un crash),
# junto con todos los eventos aún sin consumir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Lo que RabbitMQ importa al arrancar (lifecycle.postStart, más abajo): el exchange "fallidos" y la policy "fallidos",
# que manda allí lo que se rechaza en cualquier cola de trabajo (las que no llevan punto en el nombre). Cada consumidor
# declara su <cola>.fallidos ligada a ese exchange con el nombre de su cola (comun/rabbitmq.py).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-definiciones
data:
  # GENERADO desde deploy/rabbitmq/definiciones.json — no editar aquí; edita ese archivo y corre scripts/sincronizar_comun.py
  definiciones.json: |
    {
      "exchanges": [
        {
          "vhost": "/",
          "name": "fallidos",
          "type": "direct",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        }
      ],
      "policies": [
        {
          "vhost": "/",
          "name": "fallidos",
          "pattern": "^[^.]+$",
          "apply-to": "queues",
          "priority": 10,
          "definition": {
            "dead-letter-exchange": "fallidos"
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  # Recreate: RabbitMQ no tolera dos instancias sobre el mismo directorio de datos, y el
  # RollingUpdate por defecto arrancaría el pod nuevo ANTES de parar el viejo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          # El de la imagen (docker-entrypoint.sh rabbitmq-server), con un relevo delante: lo que el postStart escribe en
          # /tmp/log-poststart sale en el log del contenedor (un proceso aparte no puede escribir en su salida directo).
          command: ["sh", "-c"]
          args:
            - |
              rm -f /tmp/log-poststart && mkfifo -m 600 /tmp/log-poststart
              (while :; do cat /tmp/log-poststart; done) &
              exec docker-entrypoint.sh rabbitmq-server
          ports:
            - containerPort: 5672
            - containerPort: 15672
          # Al arrancar importa las definiciones (las policies y los exchanges de fallidos). No van con load_definitions a
          # propósito: con definiciones al arrancar RabbitMQ no crea el usuario por defecto, y en un nodo nuevo los
          # servicios no podrían conectarse. Hasta que el postStart termina el pod no está listo, así que nadie consume
          # sin las policies. El script tiene un tope de 120 s y nunca falla: si fallara, Kubernetes mataría el contenedor
          # y RabbitMQ entero quedaría caído (pasó el 2026-11-18). Lo que pasó queda en el log del contenedor, con
          # "[definiciones]" delante, y si falta una policy verificar_despliegue.py da FALLA.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    fin=$(( $(date +%s) + 120 ))
                    queda_tiempo() { [ "$(date +%s)" -lt "$fin" ]; }
                    avisar() {  # al log del contenedor, por el relevo de su comando; nunca se queda esperando
                      [ -p /tmp/log-poststart ] && echo "[definiciones] $*" | timeout 5 tee /tmp/log-poststart >/dev/null
                      return 0
                    }
                    # Primero, que el servidor cree su cookie de Erlang: si rabbitmqctl corriera antes, la crearía él como
                    # root y el servidor no podría leerla (pasa con un volumen nuevo).
                    while queda_tiempo && [ ! -s /var/lib/rabbitmq/.erlang.cookie ]; do sleep 1; done
                    # Hasta que el nodo arranca, rabbitmqctl ni siquiera puede conectarse: se reintenta hasta el tope.
                    arranco=no
                    while queda_tiempo; do
                      if timeout 15 rabbitmqctl -q await_startup >/dev/null 2>&1; then arranco=si; break; fi
                      sleep 2
                    done
                    if [ "$arranco" != si ]; then
                      avisar "RabbitMQ no respondió en 120 s: no se importaron las definiciones"
                      exit 0
                    fi
                    if ! timeout 30 rabbitmqctl -q import_definitions /etc/rabbitmq/definiciones/definiciones.json >/dev/null 2>&1; then
                      avisar "no se pudieron importar /etc/rabbitmq/definiciones/definiciones.json"
                      exit 0
                    fi
                    # La importación es asíncrona: se espera a ver la policy, hasta el tope.
                    while queda_tiempo; do
                      politicas=$(timeout 15 rabbitmqctl -q list_policies --formatter json 2>/dev/null)
                      case "$politicas" in
                        *'"name":"fallidos"'*)
                          avisar "importadas: policy fallidos lista"
                          exit 0 ;;
                      esac
                      sleep 1
                    done
                    avisar "importadas, pero las policies no aparecieron en 120 s"
                    exit 0
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: RABBITMQ_PASSWORD
            # Por defecto el nodo se llama rabbit@<hostname del pod>, y RabbitMQ guarda sus datos en
            # un directorio con ese nombre: como el hostname cambia cada vez que el Deployment
            # recrea el pod, el pod nuevo ignoraría las colas y mensajes guardados. Con nombre fijo
            # (un solo nodo) los encuentra siempre.
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
          volumeMounts:
            - name: datos
              mountPath: /var/lib/rabbitmq
            - name: definiciones
              mountPath: /etc/rabbitmq/definiciones
              readOnly: true
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
        - name: definiciones
          configMap:
            name: rabbitmq-definiciones
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
