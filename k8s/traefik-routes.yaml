# ================= CERTIFICACION (puerto 8008) — rutas /certificacion =================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: certificacion
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 1
      match: PathPrefix(`/api/certificacion`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-sesion
        - name: strip-api-prefix
      services:
        - name: certificacion
          port: 8008
    # POST .../eventos ya no existe (ver certificacion/main.py); la regla se deja por si algo lo llama. Se deja
    # explícitamente pública (sin JWT) GET .../verificar, GET .../historial, GET .../qr y
    # GET .../certificado — es la trazabilidad que cualquiera debe poder consultar escaneando
    # el QR de un producto, sin necesitar cuenta; así funciona hoy en el backend, no se cambió.
    - kind: Rule
      priority: 100
      match: Method(`POST`) && PathRegexp(`^/api/certificacion/certificacion/[^/]+/eventos$`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: certificacion
          port: 8008

---
# ================= FRONTEND (sitio estático servido por nginx, ver k8s/frontend.yaml) =================
# Todo lo que NO es /api/... llega al sitio: la SPA (index.html) y verificar.html, la página que abre quien escanea el
# QR. Sin prioridad explícita a propósito: las rutas de las APIs (priority 1 y 100) solo compiten con esta bajo /api/,
# y ahí esta regla no aplica (por eso el `!PathPrefix`). Sin rate-limit ni auth: son archivos públicos.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: "!PathPrefix(`/api/`)"
      services:
        - name: frontend
          port: 80

---
# ================= MEDIA (fotos públicas de productos y de cosechas, en MinIO) =================
# https://<dominio>/media/productos-imagenes/<archivo> y /media/cosechas-evidencias/<archivo> -> MinIO. Solo GET/HEAD y
# solo esos dos buckets: la consola de MinIO y el bucket privado de fotos de entrega (transporte-entregas) NO se exponen.
# En un despliegue, MINIO_PUBLIC_URL de Productos y de Productores tiene que apuntar a https://<dominio>/media para que
# las fotos que se suban salgan con una URL que el navegador alcance.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: media
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 100
      match: (Method(`GET`) || Method(`HEAD`)) && (PathPrefix(`/media/productos-imagenes/`) || PathPrefix(`/media/cosechas-evidencias/`))
      middlewares:
        - name: strip-media-prefix
      services:
        - name: minio
          port: 9000

---
# ================= BLOQUEADOS: lo que NO debe alcanzarse desde Internet =================
# Nada de esto lo usa el frontend, y los servicios se hablan entre sí por dentro del clúster (sin pasar por el gateway),
# así que bloquearlo aquí no rompe ningún flujo:
#   - /docs, /redoc, /openapi.json y /metrics de cada servicio (el explorador de la API y la telemetría interna).
#   - Las rutas internas entre servicios (`.../interno/...`, reponer/ajustar stock, eventos y certificados internos de
#     Certificación): las protege un secreto de servicio, pero no tienen por qué ser alcanzables desde afuera.
#   - Los DELETE de limpieza de pruebas (QA_LIMPIEZA_SECRETO). Los DELETE con sesión que sí usa el frontend
#     (/productos/imagenes/{id}, /productos/unidades/{id}) tienen otra forma de ruta y pasan.
# Prioridad 200: le gana a todas las demás rutas.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bloqueados
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 200
      match: >-
        PathRegexp(`^/api/[a-z]+/(docs|redoc|openapi\.json|metrics)$`)
        || PathRegexp(`^/api/[a-z]+/[a-z]+/interno/`)
        || (Method(`POST`) && PathRegexp(`^/api/productos/productos/[^/]+/stock/reponer$`))
        || (Method(`PATCH`) && PathRegexp(`^/api/productos/productos/[^/]+/stock$`))
        || (Method(`POST`) && PathRegexp(`^/api/certificacion/certificacion/([^/]+/(eventos-internos|cosecha-aprobada|llegada-almacen)|pedido/[^/]+/certificado)$`))
        || (Method(`DELETE`) && PathRegexp(`^/api/(usuarios/usuarios|productores/productores|productores/productores/produccion|productos/productos|pedidos/pedidos|transporte/envios|transporte/repartidores|notificaciones/notificaciones|pagos/pagos)/[^/]+$`))
      middlewares:
        - name: denegar-todo
      services:
        - name: frontend
          port: 80
