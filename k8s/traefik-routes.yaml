# ================= TRANSPORTE (puerto 8004) — rutas /envios y /repartidores =================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: transporte
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 1
      match: PathPrefix(`/api/transporte`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: strip-api-prefix
      services:
        - name: transporte
          port: 8004
    # GET /envios (listado completo) exige rol "repartidor"
    - kind: Rule
      priority: 100
      match: Method(`GET`) && Path(`/api/transporte/envios`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: transporte
          port: 8004
    # GET /envios/propuestas exige rol "repartidor"
    - kind: Rule
      priority: 100
      match: Method(`GET`) && Path(`/api/transporte/envios/propuestas`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: transporte
          port: 8004
    # POST .../aceptar y .../rechazar exigen rol "repartidor". GET .../ruta y GET /envios/{id}
    # (por pedido) son públicos en el backend actual — no se tocan.
    - kind: Rule
      priority: 100
      match: Method(`POST`) && PathRegexp(`^/api/transporte/envios/[^/]+/aceptar$`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: transporte
          port: 8004
    - kind: Rule
      priority: 100
      match: Method(`POST`) && PathRegexp(`^/api/transporte/envios/[^/]+/rechazar$`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: transporte
          port: 8004
    # PATCH .../estado y .../ubicacion exigen rol "repartidor" (y dueño del envío, validado
    # en el propio backend)
    - kind: Rule
      priority: 100
      match: Method(`PATCH`) && PathRegexp(`^/api/transporte/envios/[^/]+/estado$`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: transporte
          port: 8004
    - kind: Rule
      priority: 100
      match: Method(`PATCH`) && PathRegexp(`^/api/transporte/envios/[^/]+/ubicacion$`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: transporte
          port: 8004
    # POST /repartidores exige rol "repartidor" (crear_repartidor)
    - kind: Rule
      priority: 100
      match: Method(`POST`) && Path(`/api/transporte/repartidores`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: transporte
          port: 8004
    # GET /repartidores/me exige rol "repartidor"
    - kind: Rule
      priority: 100
      match: Method(`GET`) && Path(`/api/transporte/repartidores/me`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: transporte
          port: 8004

