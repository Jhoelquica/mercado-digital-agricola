# ================= PEDIDOS (puerto 8003) =================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pedidos
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 1
      match: PathPrefix(`/api/pedidos`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: strip-api-prefix
      services:
        - name: pedidos
          port: 8003
    # POST /pedidos exige rol "comprador" (crear_pedido). Nota: GET /pedidos/{id} es público
    # en el backend actual (sin Depends de auth) — se deja tal cual, no se le agregó protección
    # que el backend mismo no exige, siguiendo la instrucción de no aplicar el middleware a
    # rutas que hoy no requieren JWT.
    - kind: Rule
      priority: 100
      match: Method(`POST`) && Path(`/api/pedidos/pedidos`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: pedidos
          port: 8003

