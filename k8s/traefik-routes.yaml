# ================= NOTIFICACIONES (puerto 8005) =================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: notificaciones
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 1
      match: PathPrefix(`/api/notificaciones`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: strip-api-prefix
      services:
        - name: notificaciones
          port: 8005
    # Los dos únicos GET de este servicio (listado propio y por pedido) exigen JWT — ninguno
    # es público, así que basta una sola regla por PathPrefix en vez de listarlos uno por uno.
    - kind: Rule
      priority: 100
      match: Method(`GET`) && PathPrefix(`/api/notificaciones/notificaciones`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: notificaciones
          port: 8005

