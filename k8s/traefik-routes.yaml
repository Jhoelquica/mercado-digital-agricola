# ================= CERTIFICACION (puerto 8008) — rutas /certificacion y /verificadores =================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: certificacion
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 1
      match: PathPrefix(`/api/certificacion`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: strip-api-prefix
      services:
        - name: certificacion
          port: 8008
    # POST .../eventos exige rol "productor" o "verificador" (registrar_evento). Se deja
    # explícitamente pública (sin JWT) GET .../verificar, GET .../historial, GET .../qr y
    # GET .../certificado — es la trazabilidad que cualquiera debe poder consultar escaneando
    # el QR de un producto, sin necesitar cuenta; así funciona hoy en el backend, no se cambió.
    - kind: Rule
      priority: 100
      match: Method(`POST`) && PathRegexp(`^/api/certificacion/certificacion/[^/]+/eventos$`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: certificacion
          port: 8008
    # POST /verificadores exige rol "verificador" (crear perfil de verificador)
    - kind: Rule
      priority: 100
      match: Method(`POST`) && Path(`/api/certificacion/verificadores`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: certificacion
          port: 8008
    # GET /verificadores/me exige rol "verificador"
    - kind: Rule
      priority: 100
      match: Method(`GET`) && Path(`/api/certificacion/verificadores/me`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: certificacion
          port: 8008
