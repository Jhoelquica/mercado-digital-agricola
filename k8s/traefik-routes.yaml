# IngressRoutes del API Gateway: uno por microservicio, prefijo público /api/<servicio>.
#
# Cómo está armado cada IngressRoute (mismo patrón en los 8). TODA ruta de /api pasa por el ForwardAuth, con una de sus
# dos variantes (ver k8s/traefik-middlewares.yaml; scripts/verificar_despliegue.py da FALLA si alguna no lleva ninguna):
#   - Una ruta "catch-all" (PathPrefix del namespace completo, priority: 1) con la cadena
#     [rate-limit-global, cors-global, auth-sesion, strip-api-prefix]. Cubre todos los endpoints de ese servicio que no
#     tienen regla propia, públicos o con sesión, y cualquier endpoint nuevo: sin esa red quedaría inalcanzable (404 del
#     propio Gateway) hasta actualizar este archivo. auth-sesion deja pasar sin token (el servicio decide si la ruta pide
#     sesión) y rechaza con 401 un token inválido, vencido o revocado: así la revocación de sesiones vale en todas.
#   - Una o más rutas específicas (Method + Path/PathRegexp exactos, priority: 100 — le gana al
#     catch-all) para endpoints que exigen JWT en el backend (Depends(verificar_token) o
#     Depends(requiere_rol(...))), con auth-jwt, que además rechaza en el gateway la petición sin token.
#
# Los endpoints protegidos solo por header interno (X-Servicio-Secreto: llamadas servicio-a-servicio) no llevan
# Authorization: el catch-all los deja pasar y el propio microservicio exige el secreto. Los que no tienen por qué
# alcanzarse desde afuera (las rutas .../interno/..., el stock, los DELETE de limpieza QA) los bloquea la ruta
# `bloqueados` del final.
#
# Un endpoint nuevo con sesión no necesita regla propia: el catch-all ya le aplica auth-sesion (el token que traiga se
# valida y su revocación se respeta); una regla propia con auth-jwt solo agrega el rechazo en el gateway sin token.

# ================= USUARIOS (puerto 8006) =================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: usuarios
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 1
      match: PathPrefix(`/api/usuarios`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-sesion
        - name: strip-api-prefix
      services:
        - name: usuarios
          port: 8006
    # GET /usuarios/{id} exige JWT en el backend (obtener_usuario). Nota: con este patrón
    # también protege de paso GET /usuarios/usuarios/validar-token (el propio endpoint de
    # validación) — es redundante pero inofensivo, ya exige JWT igual.
    - kind: Rule
      priority: 100
      match: Method(`GET`) && PathRegexp(`^/api/usuarios/usuarios/[^/]+$`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: usuarios
          port: 8006
    # Reclamar un RUC (subida de la Ficha RUC y el DNI, hasta 5 MB cada uno) exige sesión, y la revisión de los reclamos
    # (/usuarios/admin/...) es del admin: sin JWT se rechaza aquí, antes de llegar al servicio (que igual exige el rol).
    - kind: Rule
      priority: 100
      match: PathPrefix(`/api/usuarios/usuarios/me/`) || PathPrefix(`/api/usuarios/usuarios/admin/`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: usuarios
          port: 8006

---
# ================= PRODUCTORES (puerto 8001) =================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: productores
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 1
      match: PathPrefix(`/api/productores`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-sesion
        - name: strip-api-prefix
      services:
        - name: productores
          port: 8001
    # GET /productores/me exige rol "productor" (requiere_rol("productor"))
    - kind: Rule
      priority: 100
      match: Method(`GET`) && Path(`/api/productores/productores/me`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: productores
          port: 8001
    # POST /productores exige rol "productor" (crear perfil de productor)
    - kind: Rule
      priority: 100
      match: Method(`POST`) && Path(`/api/productores/productores`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: productores
          port: 8001
    # POST /productores/produccion/{id}/foto-cosecha exige rol "productor": una subida de hasta 5 MB, mejor rechazarla
    # aquí sin sesión antes de que llegue al servicio.
    - kind: Rule
      priority: 100
      match: Method(`POST`) && PathRegexp(`^/api/productores/productores/produccion/[^/]+/foto-cosecha$`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: productores
          port: 8001

