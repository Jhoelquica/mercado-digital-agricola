# ================= PAGOS (puerto 8007) =================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pagos
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      priority: 1
      match: PathPrefix(`/api/pagos`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-sesion
        - name: strip-api-prefix
      services:
        - name: pagos
          port: 8007
    # POST /pagos/procesar exige JWT (procesar_pago). GET /pagos/{pedido_id} es público en el
    # backend actual — no se toca.
    - kind: Rule
      priority: 100
      match: Method(`POST`) && Path(`/api/pagos/pagos/procesar`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: pagos
          port: 8007
    # La transferencia bancaria: subir la constancia (hasta 5 MB) exige sesión, y la revisión (/pagos/admin/...) es
    # del admin: sin JWT se rechaza aquí, antes de llegar al servicio (que igual exige el rol).
    - kind: Rule
      priority: 100
      match: (Method(`POST`) && Path(`/api/pagos/pagos/transferencia`)) || PathPrefix(`/api/pagos/pagos/admin/`) || PathPrefix(`/api/pagos/ganancias/`)
      middlewares:
        - name: rate-limit-global
        - name: cors-global
        - name: auth-jwt
        - name: strip-api-prefix
      services:
        - name: pagos
          port: 8007

