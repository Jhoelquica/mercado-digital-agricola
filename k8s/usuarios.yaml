apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
spec:
  replicas: 3
  selector:
    matchLabels:
      app: usuarios
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      containers:
        - name: usuarios
          image: localhost:5000/usuarios:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (esperando a su base); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8006
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8006
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8006
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          env:
            - name: DB_HOST
              value: db-usuarios
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # Bloqueo del login: tras MAX_INTENTOS_LOGIN contraseñas incorrectas seguidas para un mismo correo
            # (exista o no) ese correo no puede iniciar sesión durante BLOQUEO_LOGIN_MINUTOS. Ajustables sin
            # tocar código (ver usuarios/acceso.py).
            - name: MAX_INTENTOS_LOGIN
              value: "8"
            - name: BLOQUEO_LOGIN_MINUTOS
              value: "10"
            # Antes dependía del fallback hardcodeado "clave-interna-servicios" en el código
            # (nunca estuvo wireada acá) — ahora requerida explícitamente, sin fallback.
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # Bootstrap del primer admin — ver sembrar_admin_inicial() en usuarios/main.py.
            # Idempotente: solo crea el admin si la tabla usuarios todavía no tiene ninguno.
            - name: ADMIN_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: ADMIN_BOOTSTRAP_EMAIL
            - name: ADMIN_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: ADMIN_BOOTSTRAP_PASSWORD
            - name: GOOGLE_CLIENT_ID
              value: "546858204347-n72ku2ohsq88er0p297hrd9n2rirsc86.apps.googleusercontent.com"
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios
spec:
  type: LoadBalancer
  selector:
    app: usuarios
  ports:
    - port: 8006
      targetPort: 8006