apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
spec:
  replicas: 3
  selector:
    matchLabels:
      app: usuarios
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      containers:
        - name: usuarios
          image: localhost:5000/usuarios:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
          env:
            - name: DB_HOST
              value: db-usuarios
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: JWT_SECRET
            # Antes dependía del fallback hardcodeado "clave-interna-servicios" en el código
            # (nunca estuvo wireada acá) — ahora requerida explícitamente, sin fallback.
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # Bootstrap del primer admin — ver sembrar_admin_inicial() en usuarios/main.py.
            # Idempotente: solo crea el admin si la tabla usuarios todavía no tiene ninguno.
            - name: ADMIN_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: ADMIN_BOOTSTRAP_EMAIL
            - name: ADMIN_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: ADMIN_BOOTSTRAP_PASSWORD
            - name: GOOGLE_CLIENT_ID
              value: "546858204347-n72ku2ohsq88er0p297hrd9n2rirsc86.apps.googleusercontent.com"
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios
spec:
  type: LoadBalancer
  selector:
    app: usuarios
  ports:
    - port: 8006
      targetPort: 8006