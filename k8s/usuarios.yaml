# Cómo llega Usuarios a su base: host, puerto y nombre, escritos solo aquí. Los leen el initContainer y el
# contenedor del servicio (envFrom, más abajo) y la propia base (POSTGRES_DB en db-usuarios.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: base-usuarios
data:
  DB_HOST: db-usuarios
  DB_PORT: "5432"
  DB_NAME: usuarios
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
spec:
  # 3 réplicas: Usuarios está en el camino de todas las peticiones de la API (ver el PodDisruptionBudget más abajo).
  replicas: 3
  selector:
    matchLabels:
      app: usuarios
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      # Antes de arrancar, espera a que SU base responda. Sin esto, al encender Docker Desktop (o al reiniciar la base) el
      # servicio arrancaba antes de que el DNS resolviera db-usuarios, se caía 2 o 3 veces y Kubernetes lo reiniciaba.
      # Se comprueba con psql contra SU base de datos y no con pg_isready: tras un reinicio de Docker Desktop el Service sigue
      # unos segundos con la IP vieja de la base, que el nodo puede haber dado a OTRO Postgres, y pg_isready da por buena
      # cualquier respuesta (visto el 2026-11-16: db-transporte llevaba al Postgres de db-certificacion).
      # El host, el puerto y el nombre de la base salen de la ConfigMap base-usuarios (arriba), la misma que usan el servicio
      # y la propia base. La contraseña va en PGPASSWORD desde el Secret, nunca en el comando. Misma imagen que las bases
      # (postgres:16, ya está en el nodo).
      initContainers:
        - name: esperar-base
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              intento=1
              until error=$(psql -w -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "select 1" 2>&1 >/dev/null); do
                echo "Esperando a la base $DB_NAME en $DB_HOST:$DB_PORT (intento $intento; otro en 2 s): $(echo "$error" | head -n 1)"
                intento=$((intento + 1))
                sleep 2
              done
              echo "La base $DB_NAME en $DB_HOST:$DB_PORT responde (intento $intento)"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999  # el usuario postgres de la imagen
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: base-usuarios
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_USUARIOS
            - name: PGCONNECT_TIMEOUT
              value: "3"
      # fsGroup: el grupo del usuario del contenedor (10001, ver usuarios/Dockerfile), dueño de los archivos del Secret.
      securityContext:
        fsGroup: 10001
      volumes:
        # Sin subPath: si la ConfigMap cambia (una rotación de claves), Kubernetes actualiza los archivos solo.
        - name: jwt-claves-publicas
          configMap:
            name: jwt-claves-publicas
        - name: jwt-firma
          secret:
            secretName: jwt-firma
            defaultMode: 0440  # solo lectura y solo para el grupo del proceso (fsGroup, arriba)
      containers:
        - name: usuarios
          image: localhost:5000/usuarios:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
          # Sin sondas Kubernetes manda tráfico al pod en cuanto arranca el contenedor (antes de que uvicorn escuche) y da
          # 502/504 en cada arranque o actualización. /salud responde sin tocar la base de datos. startupProbe: hasta 3 min
          # para arrancar (a su base ya la esperó el initContainer); después, readiness saca al pod del reparto si deja de responder y liveness
          # lo reinicia solo si lleva ~100 s sin responder.
          # Al apagarse (una actualización) espera 5 s antes de parar: da tiempo a que el gateway deje de mandarle peticiones
          # (se saca de los destinos a la vez que se le pide terminar) y así no se cortan las que van en camino.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /salud
              port: 8006
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /salud
              port: 8006
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /salud
              port: 8006
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: jwt-claves-publicas
              mountPath: /etc/chakrashop/jwt/publicas
              readOnly: true
            - name: jwt-firma
              mountPath: /etc/chakrashop/jwt/firma
              readOnly: true
          envFrom:
            - configMapRef:
                name: base-usuarios  # DB_HOST, DB_PORT y DB_NAME
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: DB_PASSWORD_USUARIOS
            # Las claves PÚBLICAS que verifican los tokens (RS256, ver comun/auth.py): la ConfigMap jwt-claves-publicas,
            # montada aquí abajo. La genera scripts/claves_jwt.py (en Google Cloud, deploy/gcp/crear_secretos.py).
            - name: JWT_CLAVES_PUBLICAS
              value: /etc/chakrashop/jwt/publicas
            # La clave PRIVADA que firma los tokens: el Secret jwt-firma, montado SOLO en este Deployment (ningún otro
            # servicio puede firmar; verificar_despliegue.py comprueba que no esté en ningún otro pod).
            - name: JWT_CLAVE_PRIVADA
              value: /etc/chakrashop/jwt/firma/privada.pem
            # Bloqueo del login: tras MAX_INTENTOS_LOGIN contraseñas incorrectas seguidas para un mismo correo
            # (exista o no) ese correo no puede iniciar sesión durante BLOQUEO_LOGIN_MINUTOS. Ajustables sin
            # tocar código (ver usuarios/acceso.py).
            - name: MAX_INTENTOS_LOGIN
              value: "8"
            - name: BLOQUEO_LOGIN_MINUTOS
              value: "10"
            # Caché de la versión de credencial de cada cuenta (30 s; ver usuarios/sesiones.py): con un acierto, el
            # ForwardAuth no toca la base. Si Redis no responde, se consulta la base: la comprobación no se salta.
            # REDIS_CACHE_PORT y no REDIS_PORT: Kubernetes inyecta REDIS_PORT=tcp://... (ver k8s/productos.yaml).
            - name: REDIS_HOST
              value: redis
            - name: REDIS_CACHE_PORT
              value: "6379"
            # Requerida explícitamente: el código no tiene valor por defecto.
            - name: QA_LIMPIEZA_SECRETO
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: QA_LIMPIEZA_SECRETO
            # Bootstrap del primer admin — ver sembrar_admin_inicial() en usuarios/main.py.
            # Idempotente: solo crea el admin si la tabla usuarios todavía no tiene ninguno.
            - name: ADMIN_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: ADMIN_BOOTSTRAP_EMAIL
            - name: ADMIN_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: ADMIN_BOOTSTRAP_PASSWORD
            - name: GOOGLE_CLIENT_ID
              value: "546858204347-n72ku2ohsq88er0p297hrd9n2rirsc86.apps.googleusercontent.com"
            # Verificación del RUC de un comprador negocio en el padrón público de SUNAT (ver usuarios/sunat.py). El
            # servicio respondía sin clave el 2026-10-03; desde el 2026-10-14 la exige: va en el Secret como SUNAT_RUC_TOKEN
            # (la misma de RENIEC en pedidos.yaml; se guardan las dos con scripts/poner_clave_apis_net_pe.py).
            - name: SUNAT_RUC_URL
              value: https://api.apis.net.pe/v2/sunat/ruc
            - name: SUNAT_RUC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: SUNAT_RUC_TOKEN
                  optional: true
            # Documentos de los reclamos de RUC (Ficha RUC y DNI): bucket PRIVADO usuarios-reclamos-ruc, mismas
            # credenciales de MinIO que los demás servicios.
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: credenciales-app
                  key: MINIO_ROOT_PASSWORD
---
# Usuarios está en el camino de TODAS las peticiones de la API: el ForwardAuth del gateway le pregunta por cada una (ver
# k8s/traefik-middlewares.yaml). Si no queda ninguna réplica lista, cae toda la API, incluido el catálogo público. Con
# 3 réplicas y minAvailable 2, un drenado del nodo o una actualización del clúster saca una sola a la vez (no frena los
# rollouts del Deployment, que ya reemplazan de a una).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: usuarios
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: usuarios
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios
spec:
  # ClusterIP: no se publica en el host. La única entrada es el gateway (Traefik: valida el JWT y limita las
  # peticiones); para desarrollo, scripts/abrir-puertos.ps1 lo abre en 127.0.0.1 con kubectl port-forward.
  type: ClusterIP
  selector:
    app: usuarios
  ports:
    - port: 8006
      targetPort: 8006