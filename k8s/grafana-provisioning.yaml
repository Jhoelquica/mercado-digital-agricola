                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{job=~\"usuarios|productores|productos|pedidos|transporte|notificaciones|pagos|certificacion\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: de 8",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 8
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "id": 1
        },
        {
          "type": "stat",
          "title": "Peticiones/s (total)",
