# Grafana arranca ya configurado (RNF05): la fuente de datos Prometheus y el tablero de los 8 servicios (tráfico,
# latencia p95 y errores 5xx) se cargan desde estos ConfigMaps. Antes se armaban a mano en la interfaz y, sin volumen
# persistente, se perdían cada vez que el pod se reiniciaba. Lo genera scripts/generar_tablero_grafana.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-fuentes
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-proveedor-tableros
data:
  chakrashop.yaml: |
    apiVersion: 1
    providers:
      - name: chakrashop
        folder: ChakraShop
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/chakrashop
---
apiVersion: v1
kind: ConfigMap
