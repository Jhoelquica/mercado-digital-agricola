add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# El popup de "Continuar con Google" (GIS) le habla a la página con postMessage: same-origin lo cortaría.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# CSP en observación: lo que bloquearía se informa a /csp-report (log del pod) sin bloquear nada.
# Orígenes: las APIs y las fotos van por el mismo origen (/api, /media); Culqi (pago), Google Identity (acceso), las
# teselas de OpenStreetMap (mapas), Google Fonts y los íconos de Tabler (jsDelivr).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://checkout.culqi.com https://accounts.google.com/gsi/client; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://checkout.culqi.com https://accounts.google.com/gsi/ blob:; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /csp-report" always;
