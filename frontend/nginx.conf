# Sirve el build de React (dist/). Las APIs NO pasan por aquí: el gateway Traefik las enruta en /api/<servicio> y las
# fotos en /media/...; todo lo demás llega a este servidor (ver k8s/traefik-routes.yaml).
# add_header no se hereda entre bloques: por eso las cabeceras de seguridad se incluyen en cada location.

# Lo que la CSP bloquea se escribe en el log del pod, una línea JSON por informe.
log_format csp escape=json '$request_body';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # La SPA: cualquier ruta que no es un archivo (/productor/chacras, /verificar.html, /?vista=notificaciones…) abre
    # index.html y la resuelve React Router. index.html se revalida siempre: es el que apunta a los archivos con hash.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Lo que genera Vite lleva un hash en el nombre: si cambia, cambia la URL, así que se guarda un año sin revalidar.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imágenes, íconos y videos de public/static: sin hash en el nombre, así que solo un día.
    location /static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # El service worker (avisos al celular) se revisa siempre: si se guardara, un arreglo no llegaría.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Los informes de la CSP: se leen con `kubectl logs deploy/frontend | grep csp-report`.
    location = /csp-report {
        access_log /dev/stdout csp;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8080/csp-recibido;
    }
    location = /csp-recibido {
        access_log off;
        return 204;
    }

    # docker-compose.yml monta aquí deploy/compose/frontend-gateway.conf (allí no hay Traefik); en Kubernetes no hay nada.
    include /etc/nginx/extra/*.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
