# Sirve el frontend estático (la SPA y verificar.html). Las APIs NO pasan por aquí: el gateway Traefik las
# enruta en /api/<servicio> y todo lo demás llega a este servidor (ver k8s/traefik-routes.yaml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Las páginas se revalidan siempre: el HTML es el que lleva los ?v=<hash> de los .js y .css.
    # (add_header no se hereda entre bloques: por eso las cabeceras de seguridad se incluyen en cada location.)
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # JS y CSS llevan ?v=<hash> (frontend/bump_cache_version.py): si cambian, cambia la URL, así que el navegador
    # puede guardarlos un año sin riesgo de servir una versión vieja.
    location ~* \.(js|css)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # H6: el service worker de los avisos al celular se revisa siempre (si se guardara un año, un arreglo no llegaría).
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
