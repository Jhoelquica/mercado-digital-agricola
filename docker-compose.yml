      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: &base-pagos pagos  # el único lugar con el nombre: pagos lo toma de aquí
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - pagos_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  pagos:
    build: ./pagos
    container_name: pagos
    restart: unless-stopped
    ports:
      - "127.0.0.1:8007:8007"
    environment:
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      DB_HOST: db-pagos
      DB_PORT: "5432"
      DB_NAME: *base-pagos
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:?falta RABBITMQ_USER en .env}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}"
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      CULQI_SECRET_KEY: ${CULQI_SECRET_KEY:?falta CULQI_SECRET_KEY en .env}
      PAGOS_A_PRODUCTOS_SECRETO: "${PAGOS_A_PRODUCTOS_SECRETO:?falta PAGOS_A_PRODUCTOS_SECRETO en .env}"
      TRANSPORTE_A_PAGOS_SECRETO: "${TRANSPORTE_A_PAGOS_SECRETO:?falta TRANSPORTE_A_PAGOS_SECRETO en .env}"
      PAGOS_A_PEDIDOS_SECRETO: "${PAGOS_A_PEDIDOS_SECRETO:?falta PAGOS_A_PEDIDOS_SECRETO en .env}"
      QA_LIMPIEZA_SECRETO: "${QA_LIMPIEZA_SECRETO:?falta QA_LIMPIEZA_SECRETO en .env}"
      PRODUCTOS_URL: http://productos:8002
      PEDIDOS_URL: http://pedidos:8003
      PRODUCTORES_URL: http://productores:8001
      TRANSPORTE_URL: http://transporte:8004
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${DB_USER:?falta DB_USER en .env}
      MINIO_SECRET_KEY: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      # Cuenta DE EJEMPLO para la transferencia bancaria (ver k8s/pagos.yaml).
      TRANSFERENCIA_BANCO: "BCP (cuenta de ejemplo)"
      TRANSFERENCIA_TITULAR: "Chakra Shop S.A.C."
      TRANSFERENCIA_CUENTA: "191-00000000-0-00"
      TRANSFERENCIA_CCI: "002-191-000000000000-00"
    depends_on:
      db-pagos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8007/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-certificacion:
    image: postgres:16
    container_name: db-certificacion
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: &base-certificacion certificacion  # el único lugar con el nombre: certificacion lo toma de aquí
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - certificacion_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  certificacion:
    build: ./certificacion
    container_name: certificacion
    restart: unless-stopped
    ports:
      - "127.0.0.1:8008:8008"
    environment:
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      DB_HOST: db-certificacion
      DB_PORT: "5432"
      DB_NAME: *base-certificacion
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      # A dónde apunta el QR de cada producto (/verificar lo sirve el contenedor frontend de abajo).
      FRONTEND_URL: http://localhost:8090
      TRANSPORTE_A_CERTIFICACION_SECRETO: "${TRANSPORTE_A_CERTIFICACION_SECRETO:?falta TRANSPORTE_A_CERTIFICACION_SECRETO en .env}"
      PRODUCTORES_A_CERTIFICACION_SECRETO: "${PRODUCTORES_A_CERTIFICACION_SECRETO:?falta PRODUCTORES_A_CERTIFICACION_SECRETO en .env}"
      PRODUCTOS_A_CERTIFICACION_SECRETO: "${PRODUCTOS_A_CERTIFICACION_SECRETO:?falta PRODUCTOS_A_CERTIFICACION_SECRETO en .env}"
    depends_on:
      db-certificacion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8008/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # La aplicación de React servida por nginx (frontend/Dockerfile). Como en Kubernetes, llama a /api/<servicio> y a
  # /media en su mismo origen: aquí los reparte su propio nginx (deploy/compose/frontend-gateway.conf).
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./deploy/compose/frontend-gateway.conf:/etc/nginx/extra/gateway.conf:ro
    # nginx resuelve los nombres de los servicios al arrancar.
    depends_on: [usuarios, productores, productos, pedidos, transporte, notificaciones, pagos, certificacion, minio]
    healthcheck:
      # 127.0.0.1 y no localhost: en la imagen de nginx (alpine) localhost se resuelve primero a IPv6 y nginx escucha solo en IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  rabbitmq_data:
  minio_data:
  productores_data:
  productos_data:
  pedidos_data:
  transporte_data:
  notificaciones_data:
  usuarios_data:
  pagos_data:
  certificacion_data:
