# Entorno de DESARROLLO sin Kubernetes: los 8 microservicios, sus 8 bases, Redis, RabbitMQ, MinIO y el frontend.
#
# Uso:   docker compose up -d --build          (necesita un archivo .env junto a este, ver abajo)
#        Sitio: http://localhost:8090      APIs: http://localhost:8001..8008      MinIO (consola): http://localhost:9001
#        Comprobación: python scripts/verificar_despliegue.py --directo --compose
#
# .env (no se sube a git) debe definir: DB_USER, DB_PASSWORD (mínimo 8 caracteres: también son las de MinIO), JWT_SECRET y
# CULQI_SECRET_KEY (la de PRUEBA, sk_test_...).
#
# Qué es igual que en Kubernetes (k8s/): las mismas imágenes, variables de entorno, URLs entre servicios y bases.
# Qué cambia a propósito:
#   - NO hay Traefik, Prometheus ni Grafana: existen solo en Kubernetes. Sin gateway, el navegador llama a cada servicio por
#     su puerto (el frontend lo detecta solo: en localhost, salvo el puerto 8000, usa los puertos directos), y no hay validación
#     de JWT previa, límite de peticiones ni rutas bloqueadas.
#   - Una sola instancia de cada cosa (en k8s/ los microservicios van con 3 réplicas).
#   - Los secretos entre servicios son valores de desarrollo escritos aquí (dev-...); en Kubernetes salen del Secret
#     credenciales-app y, en Google Cloud, son aleatorios.
#   - Las imágenes se construyen desde el código (build:) en vez de bajarse de un registro.
#   - Los healthcheck de abajo hacen el papel de las sondas de Kubernetes (GET /salud en cada servicio).

services:

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    # Nombre fijo: RabbitMQ guarda sus datos según el nombre del nodo; con el aleatorio de Docker las colas y los mensajes
    # pendientes no sobrevivirían a recrear el contenedor (en k8s/rabbitmq.yaml es RABBITMQ_NODENAME).
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # Fotos de los productos (bucket público productos-imagenes, lo crea Productos al arrancar) y fotos de entrega (bucket
  # privado, lo crea Transporte). Mismas credenciales que las bases, como en k8s/minio.yaml.
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${DB_USER}
      MINIO_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  db-productores:
    image: postgres:16
    container_name: db-productores
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: productores
    ports:
      - "5433:5432"
    volumes:
      - productores_data:/var/lib/postgresql/data
    healthcheck: &salud-postgres
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  productores:
    build: ./productores
    container_name: productores
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db-productores
      PRODUCTOS_URL: http://productos:8002
      CERTIFICACION_URL: http://certificacion:8008
      PRODUCTORES_A_PRODUCTOS_SECRETO: dev-productores-a-productos-secreto
      PRODUCTORES_A_CERTIFICACION_SECRETO: dev-productores-a-certificacion-secreto
      QA_LIMPIEZA_SECRETO: dev-qa-limpieza-secreto
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${DB_USER}
      MINIO_SECRET_KEY: ${DB_PASSWORD}
      MINIO_PUBLIC_URL: http://localhost:9000
      # Opcional (en .env): sin ella, la sugerencia de la fecha de cosecha sale de la tabla de ciclos típicos.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db-productores:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-productos:
    image: postgres:16
    container_name: db-productos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: productos
    ports:
      - "5434:5432"
    volumes:
      - productos_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  productos:
    build: ./productos
    container_name: productos
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db-productos
      PRODUCTORES_URL: http://productores:8001
      USUARIOS_URL: http://usuarios:8006
      CERTIFICACION_URL: http://certificacion:8008
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${DB_USER}
      MINIO_SECRET_KEY: ${DB_PASSWORD}
      MINIO_PUBLIC_URL: http://localhost:9000
      PAGOS_A_PRODUCTOS_SECRETO: dev-pagos-a-productos-secreto
      PEDIDOS_A_PRODUCTOS_SECRETO: dev-pedidos-a-productos-secreto
      PRODUCTORES_A_PRODUCTOS_SECRETO: dev-productores-a-productos-secreto
      PRODUCTOS_A_CERTIFICACION_SECRETO: dev-productos-a-certificacion-secreto
      QA_LIMPIEZA_SECRETO: dev-qa-limpieza-secreto
      REDIS_HOST: redis
      REDIS_CACHE_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
    depends_on:
      db-productos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      productores:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-pedidos:
    image: postgres:16
    container_name: db-pedidos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pedidos
    ports:
      - "5435:5432"
    volumes:
      - pedidos_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  pedidos:
    build: ./pedidos
    container_name: pedidos
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db-pedidos
      PRODUCTOS_URL: http://productos:8002
      TRANSPORTE_URL: http://transporte:8004
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      PEDIDOS_A_PRODUCTOS_SECRETO: dev-pedidos-a-productos-secreto
      TRANSPORTE_A_PEDIDOS_SECRETO: dev-transporte-a-pedidos-secreto
      QA_LIMPIEZA_SECRETO: dev-qa-limpieza-secreto
    depends_on:
      db-pedidos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      productos:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8003/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-transporte:
    image: postgres:16
    container_name: db-transporte
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: transporte
    ports:
      - "5436:5432"
    volumes:
      - transporte_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  transporte:
    build: ./transporte
    container_name: transporte
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db-transporte
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      PRODUCTORES_URL: http://productores:8001
      PRODUCTOS_URL: http://productos:8002
      PEDIDOS_URL: http://pedidos:8003
      CERTIFICACION_URL: http://certificacion:8008
      PAGOS_URL: http://pagos:8007
      TRANSPORTE_A_CERTIFICACION_SECRETO: dev-transporte-a-certificacion-secreto
      TRANSPORTE_A_PAGOS_SECRETO: dev-transporte-a-pagos-secreto
      TRANSPORTE_A_PEDIDOS_SECRETO: dev-transporte-a-pedidos-secreto
      QA_LIMPIEZA_SECRETO: dev-qa-limpieza-secreto
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${DB_USER}
      MINIO_SECRET_KEY: ${DB_PASSWORD}
      MINIO_PUBLIC_URL: http://localhost:9000
    depends_on:
      db-transporte:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8004/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-notificaciones:
    image: postgres:16
    container_name: db-notificaciones
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: notificaciones
    ports:
      - "5437:5432"
    volumes:
      - notificaciones_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  notificaciones:
    build: ./notificaciones
    container_name: notificaciones
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db-notificaciones
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      QA_LIMPIEZA_SECRETO: dev-qa-limpieza-secreto
    depends_on:
      db-notificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8005/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-usuarios:
    image: postgres:16
    container_name: db-usuarios
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: usuarios
    ports:
      - "5438:5432"
    volumes:
      - usuarios_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  usuarios:
    build: ./usuarios
    container_name: usuarios
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db-usuarios
      JWT_SECRET: ${JWT_SECRET}
      QA_LIMPIEZA_SECRETO: dev-qa-limpieza-secreto
      # Bloqueo del login por correo (ver usuarios/acceso.py): mismos valores que k8s/usuarios.yaml.
      MAX_INTENTOS_LOGIN: "8"
      BLOQUEO_LOGIN_MINUTOS: "10"
      # Bootstrap del primer admin (ver sembrar_admin_inicial() en usuarios/main.py). Solo corre si la BD todavía no tiene
      # ningún admin. Valores de DESARROLLO.
      ADMIN_BOOTSTRAP_EMAIL: admin@chakrashop.pe
      ADMIN_BOOTSTRAP_PASSWORD: dev-admin-12345
      GOOGLE_CLIENT_ID: 546858204347-n72ku2ohsq88er0p297hrd9n2rirsc86.apps.googleusercontent.com
      # Verificación del RUC en SUNAT (ver k8s/usuarios.yaml). El token es opcional (en .env).
      SUNAT_RUC_URL: https://api.apis.net.pe/v2/sunat/ruc
      SUNAT_RUC_TOKEN: ${SUNAT_RUC_TOKEN:-}
      # Documentos de los reclamos de RUC (bucket privado usuarios-reclamos-ruc)
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${DB_USER}
      MINIO_SECRET_KEY: ${DB_PASSWORD}
    depends_on:
      db-usuarios:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8006/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-pagos:
    image: postgres:16
    container_name: db-pagos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pagos
    ports:
      - "5439:5432"
    volumes:
      - pagos_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  pagos:
    build: ./pagos
    container_name: pagos
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db-pagos
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      JWT_SECRET: ${JWT_SECRET}
      CULQI_SECRET_KEY: ${CULQI_SECRET_KEY}
      PAGOS_A_PRODUCTOS_SECRETO: dev-pagos-a-productos-secreto
      TRANSPORTE_A_PAGOS_SECRETO: dev-transporte-a-pagos-secreto
      QA_LIMPIEZA_SECRETO: dev-qa-limpieza-secreto
      PRODUCTOS_URL: http://productos:8002
      PEDIDOS_URL: http://pedidos:8003
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${DB_USER}
      MINIO_SECRET_KEY: ${DB_PASSWORD}
      # Cuenta DE EJEMPLO para la transferencia bancaria (ver k8s/pagos.yaml).
      TRANSFERENCIA_BANCO: "BCP (cuenta de ejemplo)"
      TRANSFERENCIA_TITULAR: "Chakra Shop S.A.C."
      TRANSFERENCIA_CUENTA: "191-00000000-0-00"
      TRANSFERENCIA_CCI: "002-191-000000000000-00"
    depends_on:
      db-pagos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8007/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-certificacion:
    image: postgres:16
    container_name: db-certificacion
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: certificacion
    ports:
      - "5440:5432"
    volumes:
      - certificacion_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  certificacion:
    build: ./certificacion
    container_name: certificacion
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db-certificacion
      JWT_SECRET: ${JWT_SECRET}
      # A dónde apunta el QR de cada producto (verificar.html lo sirve el contenedor frontend de abajo).
      FRONTEND_URL: http://localhost:8090
      PRODUCTORES_URL: http://productores:8001
      TRANSPORTE_A_CERTIFICACION_SECRETO: dev-transporte-a-certificacion-secreto
      PRODUCTORES_A_CERTIFICACION_SECRETO: dev-productores-a-certificacion-secreto
      PRODUCTOS_A_CERTIFICACION_SECRETO: dev-productos-a-certificacion-secreto
    depends_on:
      db-certificacion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8008/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # La SPA servida por nginx (frontend/Dockerfile). En localhost y con un puerto distinto de 8000 llama a cada servicio por su
  # puerto (8001..8008), que es lo que publica este compose; en Kubernetes va detrás del gateway, en /api/<servicio>.
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8090:8080"
    healthcheck:
      # 127.0.0.1 y no localhost: en la imagen de nginx (alpine) localhost se resuelve primero a IPv6 y nginx escucha solo en IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  rabbitmq_data:
  minio_data:
  productores_data:
  productos_data:
  pedidos_data:
  transporte_data:
  notificaciones_data:
  usuarios_data:
  pagos_data:
  certificacion_data:
