# Entorno de DESARROLLO sin Kubernetes: los 8 microservicios, sus 8 bases, Redis, RabbitMQ, MinIO y el frontend.
#
# Uso:   docker compose up -d --build          (necesita un archivo .env junto a este, ver abajo)
#        Sitio: http://localhost:8090      APIs: http://localhost:8001..8008      MinIO (consola): http://localhost:9001
#        Comprobación: python scripts/verificar_despliegue.py --directo --compose
#
# .env (no se sube a git; cópialo de .env.example y cambia TODOS los valores) define todas las credenciales: DB_USER y
# DB_PASSWORD (mínimo 8 caracteres: también son las de MinIO), JWT_SECRET, CULQI_SECRET_KEY (la de PRUEBA, sk_test_...),
# RABBITMQ_USER/RABBITMQ_PASSWORD, ADMIN_BOOTSTRAP_PASSWORD, QA_LIMPIEZA_SECRETO y las 7 claves entre servicios
# (*_A_*_SECRETO). Si falta una, docker compose se niega a arrancar y dice cuál.
#
# Qué es igual que en Kubernetes (k8s/): las mismas imágenes, variables de entorno, URLs entre servicios y bases.
# Qué cambia a propósito:
#   - NO hay Traefik, Prometheus ni Grafana: existen solo en Kubernetes. En su lugar, el nginx del frontend reparte /api/<servicio>
#     y /media con las mismas rutas (deploy/compose/frontend-gateway.conf), sin validación de JWT previa, límite de peticiones ni
#     rutas bloqueadas. Los puertos 8001..8008 siguen publicados para probar cada API directo.
#   - Todos los puertos publicados escuchan solo en 127.0.0.1: no se ven desde otras máquinas de la red.
#   - Una sola instancia de cada cosa (en k8s/ los microservicios van con 3 réplicas).
#   - Ninguna credencial va escrita aquí: salen de .env. En Kubernetes salen del Secret credenciales-app y, en Google
#     Cloud, son aleatorias.
#   - Las imágenes se construyen desde el código (build:) en vez de bajarse de un registro.
#   - Los healthcheck de abajo hacen el papel de las sondas de Kubernetes (GET /salud en cada servicio).

services:

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    # Nombre fijo: RabbitMQ guarda sus datos según el nombre del nodo; con el aleatorio de Docker las colas y los mensajes
    # pendientes no sobrevivirían a recrear el contenedor (en k8s/rabbitmq.yaml es RABBITMQ_NODENAME).
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?falta RABBITMQ_USER en .env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # La policy y el exchange de fallidos (en k8s es la ConfigMap rabbitmq-definiciones, copia de este archivo).
      - ./deploy/rabbitmq/definiciones.json:/etc/rabbitmq/definiciones/definiciones.json:ro
    healthcheck:
      # Sano cuando responde y ya tiene la policy "fallidos". Si le falta, la importa y espera al chequeo siguiente: los
      # servicios esperan a que esté sano (depends_on), así ninguno consume sin ella.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && { rabbitmqctl -q list_policies --formatter json | grep -q '\"name\":\"fallidos\"' || { rabbitmqctl -q import_definitions /etc/rabbitmq/definiciones/definiciones.json; exit 1; }; }"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # Fotos de los productos (bucket público productos-imagenes, lo crea Productos al arrancar) y fotos de entrega (bucket
  # privado, lo crea Transporte). Mismas credenciales que las bases, como en k8s/minio.yaml.
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${DB_USER:?falta DB_USER en .env}
      MINIO_ROOT_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  db-productores:
    image: postgres:16
    container_name: db-productores
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: &base-productores productores  # el único lugar con el nombre: productores lo toma de aquí
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - productores_data:/var/lib/postgresql/data
    healthcheck: &salud-postgres
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  productores:
    build: ./productores
    container_name: productores
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      DB_HOST: db-productores
      DB_PORT: "5432"
      DB_NAME: *base-productores
      PRODUCTOS_URL: http://productos:8002
      PEDIDOS_URL: http://pedidos:8003
      CERTIFICACION_URL: http://certificacion:8008
      PRODUCTORES_A_PRODUCTOS_SECRETO: "${PRODUCTORES_A_PRODUCTOS_SECRETO:?falta PRODUCTORES_A_PRODUCTOS_SECRETO en .env}"
      PRODUCTORES_A_CERTIFICACION_SECRETO: "${PRODUCTORES_A_CERTIFICACION_SECRETO:?falta PRODUCTORES_A_CERTIFICACION_SECRETO en .env}"
      QA_LIMPIEZA_SECRETO: "${QA_LIMPIEZA_SECRETO:?falta QA_LIMPIEZA_SECRETO en .env}"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${DB_USER:?falta DB_USER en .env}
      MINIO_SECRET_KEY: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      MINIO_PUBLIC_URL: http://localhost:9000
      # Opcional (en .env): sin ella, la sugerencia de la fecha de cosecha sale de la tabla de ciclos típicos.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db-productores:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-productos:
    image: postgres:16
    container_name: db-productos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: &base-productos productos  # el único lugar con el nombre: productos lo toma de aquí
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - productos_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  productos:
    build: ./productos
    container_name: productos
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      DB_HOST: db-productos
      DB_PORT: "5432"
      DB_NAME: *base-productos
      PRODUCTORES_URL: http://productores:8001
      USUARIOS_URL: http://usuarios:8006
      PEDIDOS_URL: http://pedidos:8003
      CERTIFICACION_URL: http://certificacion:8008
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${DB_USER:?falta DB_USER en .env}
      MINIO_SECRET_KEY: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      MINIO_PUBLIC_URL: http://localhost:9000
      PAGOS_A_PRODUCTOS_SECRETO: "${PAGOS_A_PRODUCTOS_SECRETO:?falta PAGOS_A_PRODUCTOS_SECRETO en .env}"
      PEDIDOS_A_PRODUCTOS_SECRETO: "${PEDIDOS_A_PRODUCTOS_SECRETO:?falta PEDIDOS_A_PRODUCTOS_SECRETO en .env}"
      PRODUCTORES_A_PRODUCTOS_SECRETO: "${PRODUCTORES_A_PRODUCTOS_SECRETO:?falta PRODUCTORES_A_PRODUCTOS_SECRETO en .env}"
      PRODUCTOS_A_CERTIFICACION_SECRETO: "${PRODUCTOS_A_CERTIFICACION_SECRETO:?falta PRODUCTOS_A_CERTIFICACION_SECRETO en .env}"
      QA_LIMPIEZA_SECRETO: "${QA_LIMPIEZA_SECRETO:?falta QA_LIMPIEZA_SECRETO en .env}"
      REDIS_HOST: redis
      REDIS_CACHE_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:?falta RABBITMQ_USER en .env}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}"
    depends_on:
      db-productos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      productores:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-pedidos:
    image: postgres:16
    container_name: db-pedidos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: &base-pedidos pedidos  # el único lugar con el nombre: pedidos lo toma de aquí
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pedidos_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  pedidos:
    build: ./pedidos
    container_name: pedidos
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      DB_HOST: db-pedidos
      DB_PORT: "5432"
      DB_NAME: *base-pedidos
      PRODUCTOS_URL: http://productos:8002
      TRANSPORTE_URL: http://transporte:8004
      PAGOS_URL: http://pagos:8007
      PRODUCTORES_URL: http://productores:8001
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:?falta RABBITMQ_USER en .env}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}"
      PEDIDOS_A_PRODUCTOS_SECRETO: "${PEDIDOS_A_PRODUCTOS_SECRETO:?falta PEDIDOS_A_PRODUCTOS_SECRETO en .env}"
      TRANSPORTE_A_PEDIDOS_SECRETO: "${TRANSPORTE_A_PEDIDOS_SECRETO:?falta TRANSPORTE_A_PEDIDOS_SECRETO en .env}"
      PAGOS_A_PEDIDOS_SECRETO: "${PAGOS_A_PEDIDOS_SECRETO:?falta PAGOS_A_PEDIDOS_SECRETO en .env}"
      QA_LIMPIEZA_SECRETO: "${QA_LIMPIEZA_SECRETO:?falta QA_LIMPIEZA_SECRETO en .env}"
      # RENIEC simulado con los DNIs de prueba de pedidos/reniec.py (solo para desarrollo local).
      RENIEC_MODO: simulado
    depends_on:
      db-pedidos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      productos:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8003/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-transporte:
    image: postgres:16
    container_name: db-transporte
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: &base-transporte transporte  # el único lugar con el nombre: transporte lo toma de aquí
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - transporte_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  transporte:
    build: ./transporte
    container_name: transporte
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      DB_HOST: db-transporte
      DB_PORT: "5432"
      DB_NAME: *base-transporte
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:?falta RABBITMQ_USER en .env}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}"
      PRODUCTORES_URL: http://productores:8001
      PRODUCTOS_URL: http://productos:8002
      PEDIDOS_URL: http://pedidos:8003
      CERTIFICACION_URL: http://certificacion:8008
      PAGOS_URL: http://pagos:8007
      TRANSPORTE_A_CERTIFICACION_SECRETO: "${TRANSPORTE_A_CERTIFICACION_SECRETO:?falta TRANSPORTE_A_CERTIFICACION_SECRETO en .env}"
      TRANSPORTE_A_PAGOS_SECRETO: "${TRANSPORTE_A_PAGOS_SECRETO:?falta TRANSPORTE_A_PAGOS_SECRETO en .env}"
      TRANSPORTE_A_PEDIDOS_SECRETO: "${TRANSPORTE_A_PEDIDOS_SECRETO:?falta TRANSPORTE_A_PEDIDOS_SECRETO en .env}"
      QA_LIMPIEZA_SECRETO: "${QA_LIMPIEZA_SECRETO:?falta QA_LIMPIEZA_SECRETO en .env}"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${DB_USER:?falta DB_USER en .env}
      MINIO_SECRET_KEY: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      MINIO_PUBLIC_URL: http://localhost:9000
    depends_on:
      db-transporte:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8004/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-notificaciones:
    image: postgres:16
    container_name: db-notificaciones
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: &base-notificaciones notificaciones  # el único lugar con el nombre: notificaciones lo toma de aquí
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - notificaciones_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  notificaciones:
    build: ./notificaciones
    container_name: notificaciones
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      DB_HOST: db-notificaciones
      DB_PORT: "5432"
      DB_NAME: *base-notificaciones
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:?falta RABBITMQ_USER en .env}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}"
      QA_LIMPIEZA_SECRETO: "${QA_LIMPIEZA_SECRETO:?falta QA_LIMPIEZA_SECRETO en .env}"
      # H6: avisos al celular y por correo; vacías = apagados (ver notificaciones/avisos_externos.py).
      USUARIOS_URL: http://usuarios:8006
      VAPID_CLAVE_PUBLICA: ${VAPID_CLAVE_PUBLICA:-}
      VAPID_CLAVE_PRIVADA: ${VAPID_CLAVE_PRIVADA:-}
      VAPID_CONTACTO: ${VAPID_CONTACTO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-}
    depends_on:
      db-notificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8005/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-usuarios:
    image: postgres:16
    container_name: db-usuarios
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: &base-usuarios usuarios  # el único lugar con el nombre: usuarios lo toma de aquí
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - usuarios_data:/var/lib/postgresql/data
    healthcheck: *salud-postgres

  usuarios:
    build: ./usuarios
    container_name: usuarios
    restart: unless-stopped
    ports:
      - "127.0.0.1:8006:8006"
    environment:
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      DB_HOST: db-usuarios
      DB_PORT: "5432"
      DB_NAME: *base-usuarios
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      QA_LIMPIEZA_SECRETO: "${QA_LIMPIEZA_SECRETO:?falta QA_LIMPIEZA_SECRETO en .env}"
      # Bloqueo del login por correo (ver usuarios/acceso.py): mismos valores que k8s/usuarios.yaml.
      MAX_INTENTOS_LOGIN: "8"
      BLOQUEO_LOGIN_MINUTOS: "10"
      # Bootstrap del primer admin (ver sembrar_admin_inicial() en usuarios/main.py). Solo corre si la BD todavía no tiene
      # ningún admin. Valores de DESARROLLO.
      ADMIN_BOOTSTRAP_EMAIL: admin@chakrashop.pe
      ADMIN_BOOTSTRAP_PASSWORD: "${ADMIN_BOOTSTRAP_PASSWORD:?falta ADMIN_BOOTSTRAP_PASSWORD en .env}"
      GOOGLE_CLIENT_ID: 546858204347-n72ku2ohsq88er0p297hrd9n2rirsc86.apps.googleusercontent.com
      # Verificación del RUC en SUNAT (ver k8s/usuarios.yaml). El token es opcional (en .env).
      SUNAT_RUC_URL: https://api.apis.net.pe/v2/sunat/ruc
      SUNAT_RUC_TOKEN: ${SUNAT_RUC_TOKEN:-}
      # Documentos de los reclamos de RUC (bucket privado usuarios-reclamos-ruc)
