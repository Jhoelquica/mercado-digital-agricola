# PLANTILLA del Secret `credenciales-app` para el clúster LOCAL (Docker Desktop). No contiene secretos reales.
#
#   1. Cópiala a k8s/secret.yaml (ese archivo está en .gitignore: nunca se sube).
#   2. Reemplaza cada "cambiar-..." por un valor propio. Para los *_SECRETO sirve cualquier texto largo al azar, por
#      ejemplo: python -c "import secrets; print(secrets.token_hex(32))"
#   3. kubectl apply -f k8s/secret.yaml   (ANTES de crear las bases)
#   4. Las claves de los tokens (RS256): python scripts/claves_jwt.py nueva y python scripts/claves_jwt.py aplicar. El
#      script agrega a k8s/secret.yaml el Secret jwt-firma (la clave privada, solo para Usuarios) y crea la ConfigMap
#      jwt-claves-publicas: no van en esta plantilla.
#
# OJO: si el clúster YA tiene este Secret, no lo vuelvas a aplicar entero. Cambiar una DB_PASSWORD_* con las bases ya
# creadas las deja inaccesibles (Postgres guarda la contraseña en su volumen: cámbiala también con ALTER ROLE); para
# cambiar una sola clave usa kubectl patch.
# Está fuera de k8s/ a propósito: así "kubectl apply -f k8s/" nunca aplica estos valores de ejemplo.
apiVersion: v1
kind: Secret
metadata:
  name: credenciales-app
type: Opaque
stringData:
  # Usuario de las 8 bases PostgreSQL y una contraseña DISTINTA para cada base (mínimo 8 caracteres; con
  # python -c "import secrets; print(secrets.token_urlsafe(24))" sale una que sirve tal cual en la URL de conexión).
  DB_USER: chakra
  DB_PASSWORD_USUARIOS: cambiar-contrasena-base-usuarios
  DB_PASSWORD_PRODUCTORES: cambiar-contrasena-base-productores
  DB_PASSWORD_PRODUCTOS: cambiar-contrasena-base-productos
  DB_PASSWORD_PEDIDOS: cambiar-contrasena-base-pedidos
  DB_PASSWORD_TRANSPORTE: cambiar-contrasena-base-transporte
  DB_PASSWORD_NOTIFICACIONES: cambiar-contrasena-base-notificaciones
  DB_PASSWORD_PAGOS: cambiar-contrasena-base-pagos
  DB_PASSWORD_CERTIFICACION: cambiar-contrasena-base-certificacion
  # RabbitMQ, MinIO (usuario raíz) y Grafana (admin): cada uno con su propia contraseña, distinta de las de las bases.
  # RabbitMQ y Grafana toman estos valores solo la PRIMERA vez que arrancan con su volumen vacío; para cambiarlos después:
  # rabbitmqctl change_password (RabbitMQ guarda el usuario en su volumen). MinIO y Grafana (sin volumen) los toman al reiniciar.
  RABBITMQ_USER: chakra
  RABBITMQ_PASSWORD: cambiar-contrasena-rabbitmq
  MINIO_ROOT_USER: chakra
  MINIO_ROOT_PASSWORD: cambiar-contrasena-minio
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: cambiar-contrasena-grafana
  # Culqi en modo PRUEBA (pk_test_... / sk_test_...). La pública también va en el build del frontend (VITE_CULQI_PUBLIC_KEY).
  CULQI_PUBLIC_KEY: pk_test_cambiar
  CULQI_SECRET_KEY: sk_test_cambiar
  # Una clave por cada par de servicios que se llaman entre sí (emisor_A_receptor), distinta del JWT del usuario.
  PAGOS_A_PRODUCTOS_SECRETO: cambiar-1
  PEDIDOS_A_PRODUCTOS_SECRETO: cambiar-2
  PRODUCTORES_A_PRODUCTOS_SECRETO: cambiar-3
  PRODUCTORES_A_CERTIFICACION_SECRETO: cambiar-4
  PRODUCTOS_A_CERTIFICACION_SECRETO: cambiar-5
  TRANSPORTE_A_CERTIFICACION_SECRETO: cambiar-6
  TRANSPORTE_A_PAGOS_SECRETO: cambiar-7
  TRANSPORTE_A_PEDIDOS_SECRETO: cambiar-8
  PAGOS_A_PEDIDOS_SECRETO: cambiar-12
  # Habilita los DELETE de limpieza de datos de prueba (el gateway igual los bloquea desde afuera).
  QA_LIMPIEZA_SECRETO: cambiar-10
  # Primer administrador: Usuarios lo crea al arrancar si todavía no hay ninguno.
  ADMIN_BOOTSTRAP_EMAIL: admin@chakrashop.pe
  ADMIN_BOOTSTRAP_PASSWORD: cambiar-contrasena-del-admin
  # Opcionales: la IA que sugiere la fecha de cosecha (Gemini, plan gratuito) y la clave de la consulta de RUC en SUNAT.
  # Sin ellas, Productores usa la tabla de ciclos típicos y la consulta de RUC funciona sin clave.
  GEMINI_API_KEY: ""
  # SUNAT_RUC_TOKEN: ""
