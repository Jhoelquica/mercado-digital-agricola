# PLANTILLA del Secret `credenciales-app` para el clúster LOCAL (Docker Desktop). No contiene secretos reales.
#
#   1. Cópiala a k8s/secret.yaml (ese archivo está en .gitignore: nunca se sube).
#   2. Reemplaza cada "cambiar-..." por un valor propio. Para los *_SECRETO y JWT_SECRET sirve cualquier texto largo al
#      azar, por ejemplo: python -c "import secrets; print(secrets.token_hex(32))"
#   3. kubectl apply -f k8s/secret.yaml   (ANTES de crear las bases)
#
# OJO: si el clúster YA tiene este Secret, no lo vuelvas a aplicar entero. Cambiar DB_PASSWORD con las bases ya creadas
# las deja inaccesibles; para cambiar una sola clave usa kubectl patch.
# Está fuera de k8s/ a propósito: así "kubectl apply -f k8s/" nunca aplica estos valores de ejemplo.
apiVersion: v1
kind: Secret
metadata:
  name: credenciales-app
type: Opaque
stringData:
  # Usuario y contraseña de las 8 bases PostgreSQL y de MinIO (la contraseña, mínimo 8 caracteres).
  DB_USER: chakra
  DB_PASSWORD: cambiar-contrasena-de-las-bases
  # Firma de los JWT: la usa Usuarios para emitirlos y los demás servicios para validarlos.
  JWT_SECRET: cambiar-secreto-jwt-largo-y-al-azar
  # Culqi en modo PRUEBA (pk_test_... / sk_test_...). La pública también está en frontend/js/api.js.
  CULQI_PUBLIC_KEY: pk_test_cambiar
  CULQI_SECRET_KEY: sk_test_cambiar
  # Una clave por cada par de servicios que se llaman entre sí (emisor_A_receptor), distinta del JWT del usuario.
  PAGOS_A_PRODUCTOS_SECRETO: cambiar-1
  PEDIDOS_A_PRODUCTOS_SECRETO: cambiar-2
  PRODUCTORES_A_PRODUCTOS_SECRETO: cambiar-3
  PRODUCTORES_A_CERTIFICACION_SECRETO: cambiar-4
  PRODUCTOS_A_CERTIFICACION_SECRETO: cambiar-5
  TRANSPORTE_A_CERTIFICACION_SECRETO: cambiar-6
  TRANSPORTE_A_PAGOS_SECRETO: cambiar-7
  TRANSPORTE_A_PEDIDOS_SECRETO: cambiar-8
  CERTIFICACION_A_USUARIOS_SECRETO: cambiar-9
  # Habilita los DELETE de limpieza de datos de prueba (el gateway igual los bloquea desde afuera).
  QA_LIMPIEZA_SECRETO: cambiar-10
  # Primer administrador: Usuarios lo crea al arrancar si todavía no hay ninguno.
  ADMIN_BOOTSTRAP_EMAIL: admin@chakrashop.pe
  ADMIN_BOOTSTRAP_PASSWORD: cambiar-contrasena-del-admin
  # Opcionales: la IA que sugiere la fecha de cosecha (Gemini, plan gratuito) y la clave de la consulta de RUC en SUNAT.
  # Sin ellas, Productores usa la tabla de ciclos típicos y la consulta de RUC funciona sin clave.
  GEMINI_API_KEY: ""
  # SUNAT_RUC_TOKEN: ""
