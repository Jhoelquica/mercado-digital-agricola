# Solo para docker-compose.yml (allí no hay Traefik): el nginx del frontend hace de gateway con las mismas rutas que
# k8s/traefik-routes.yaml, para que la aplicación use un solo origen como en Kubernetes. Sin la validación de JWT, el
# límite de peticiones ni las rutas bloqueadas del gateway: es un entorno de desarrollo.
client_max_body_size 12m;

location /api/usuarios/       { proxy_pass http://usuarios:8006/; }
location /api/productores/    { proxy_pass http://productores:8001/; }
location /api/productos/      { proxy_pass http://productos:8002/; }
location /api/pedidos/        { proxy_pass http://pedidos:8003/; }
location /api/transporte/     { proxy_pass http://transporte:8004/; }
location /api/notificaciones/ { proxy_pass http://notificaciones:8005/; }
location /api/pagos/          { proxy_pass http://pagos:8007/; }
location /api/certificacion/  { proxy_pass http://certificacion:8008/; }

# Las fotos públicas (solo esos dos buckets y solo lectura, como en el gateway).
location /media/productos-imagenes/   { limit_except GET { deny all; } proxy_pass http://minio:9000/productos-imagenes/; }
location /media/cosechas-evidencias/  { limit_except GET { deny all; } proxy_pass http://minio:9000/cosechas-evidencias/; }
